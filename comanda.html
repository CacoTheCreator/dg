:root{
  --navy:#0e1e56; --navy-2:#0b1845; --navy-3:#081234;
  --sky:#51b5f2; --sky-lt:#a6d9f8; --cream:#f9f3ec; --beige:#e3ded9;
  --pistacho:#c4d870; --shu:#cf3f2f; --lima:#E8FF77;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{background:linear-gradient(175deg,var(--navy) 0%,var(--navy-2) 60%,var(--navy-3) 100%);
  background-attachment:fixed;color:var(--cream);
  font-family:'DM Sans',sans-serif;font-weight:300;min-height:100%;
  padding-bottom:calc(86px + env(safe-area-inset-bottom))}

header{padding:12px 16px 0}
header .arriba{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header .marca{font-family:'Syne',sans-serif;font-weight:700;font-size:18px;white-space:nowrap}
header .marca i{font-style:normal;color:var(--sky)}
header .chip{font-family:'DM Sans',sans-serif;font-weight:500;font-size:11px;color:var(--navy);
  background:var(--lima);border-radius:999px;padding:3px 10px;white-space:nowrap}
header .dia{margin-left:auto;font-size:12.5px;color:rgba(249,243,236,.6);white-space:nowrap}
header .dia b{font-weight:500;color:var(--cream)}
header button.ajustes{background:none;border:1px solid rgba(249,243,236,.25);color:var(--cream);
  border-radius:999px;padding:5px 12px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer}

.pestanas{display:flex;gap:8px;margin:12px 0 0;border-bottom:1px solid rgba(249,243,236,.12)}
.pestanas button{background:none;border:none;color:rgba(249,243,236,.55);cursor:pointer;
  font-family:'Syne',sans-serif;font-weight:700;font-size:15px;padding:10px 14px 12px;position:relative}
.pestanas button.viva{color:var(--cream)}
.pestanas button.viva::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;
  background:var(--lima)}
.pestanas button .globo{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;
  background:var(--shu);color:#fff;border-radius:999px;
  font-family:'DM Sans',sans-serif;font-weight:500;font-size:12px;vertical-align:2px}
.pestanas button .globo:empty{display:none}

main{padding:16px}
/* La vista que no toca se esconde con el atributo hidden. Va con !important
   porque main.tomar{display:flex} del ancho de escritorio le gana por
   especificidad y dejaba los productos pegados encima de las otras vistas. */
main[hidden]{display:none!important}

/* ── Tomar pedido: productos ── */
#productos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.prod{background:var(--cream);color:var(--navy);border:none;border-radius:16px;
  padding:14px 14px 12px;text-align:left;cursor:pointer;min-height:104px;
  display:flex;flex-direction:column;gap:4px;
  box-shadow:0 6px 18px rgba(4,9,29,.35);transition:transform 70ms ease}
.prod:active{transform:scale(.97)}
.prod h3{font-family:'Syne',sans-serif;font-weight:700;font-size:18px;line-height:1.05}
.prod .det{font-size:12.5px;color:rgba(14,30,86,.6);font-weight:300;line-height:1.25}
.prod .desde{margin-top:auto;font-weight:500;font-size:14px}
.prod.libre{background:transparent;border:1.5px dashed rgba(249,243,236,.4);color:var(--cream)}
.prod.libre h3{color:var(--cream)}
.prod.libre .det{color:rgba(249,243,236,.55)}
.prod.promo{background:var(--lima)}
.prod.promo .det{color:rgba(14,30,86,.68)}

/* ── Barra inferior (móvil) ── */
#barra{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--navy-3);border-top:1px solid rgba(249,243,236,.15);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:14px}
#barra .resumen{font-size:14px;color:rgba(249,243,236,.7)}
#barra .resumen b{display:block;font-family:'Syne',sans-serif;font-weight:700;font-size:19px;color:var(--cream)}
#barra button{margin-left:auto;background:var(--lima);color:var(--navy);border:none;border-radius:12px;
  font-family:'Syne',sans-serif;font-weight:700;font-size:16px;padding:13px 20px;cursor:pointer;
  box-shadow:3px 3px 0 rgba(8,18,52,.9)}
#barra button:active{transform:translate(2px,2px);box-shadow:0 0 0 transparent}
#barra button:disabled{opacity:.35}

/* ── Hoja del pedido ── */
#velo-panel{position:fixed;inset:0;background:rgba(8,18,52,.7);z-index:45}
#velo-panel[hidden]{display:none}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:46;max-height:86vh;overflow:auto;
  background:var(--cream);color:var(--navy);border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.3,.8,.3,1)}
#panel.abierto{transform:translateY(0)}
#panel .asa{width:44px;height:4px;border-radius:2px;background:rgba(14,30,86,.2);margin:0 auto}
#panel .num{display:flex;align-items:baseline;justify-content:space-between}
#panel .num b{font-family:'Syne',sans-serif;font-weight:700;font-size:22px}
#panel .num span{font-size:13px;color:rgba(14,30,86,.55)}
#lineas{display:flex;flex-direction:column;gap:8px;min-height:48px}
#lineas .vacio{font-size:14px;color:rgba(14,30,86,.45);padding:10px 0}
.linea{display:flex;align-items:center;gap:10px;background:rgba(14,30,86,.06);
  border-radius:10px;padding:8px 10px}
.linea .qty{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;min-width:22px;text-align:center}
.linea .desc{flex:1;font-size:15px;font-weight:500;line-height:1.2}
.linea .desc small{display:block;font-weight:300;font-size:12.5px;color:rgba(14,30,86,.6)}
.linea .precio{font-weight:500;font-size:14px}
.linea button{background:none;border:none;font-size:18px;cursor:pointer;padding:4px 8px}
.linea .mas{color:var(--navy);border:1px solid rgba(14,30,86,.25);border-radius:8px;font-size:15px}
.linea .quitar{color:var(--shu)}

#panel label.nombre{display:flex;flex-direction:column;gap:4px;font-size:13px;color:rgba(14,30,86,.6)}
#panel input[type=text]{border:1.5px solid rgba(14,30,86,.25);border-radius:10px;background:#fff;
  padding:11px 12px;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;color:var(--navy);outline:none}
#panel input[type=text]:focus{border-color:var(--sky)}
.dsctos{display:flex;gap:8px;flex-wrap:wrap}
.dsctos button{background:#fff;border:1.5px solid rgba(14,30,86,.25);color:var(--navy);
  border-radius:999px;padding:9px 14px;font-family:'DM Sans',sans-serif;font-weight:500;
  font-size:14px;cursor:pointer}
.dsctos button.sel{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.total{display:flex;justify-content:space-between;align-items:baseline;
  border-top:1.5px solid rgba(14,30,86,.15);padding-top:10px}
.total span{font-size:15px}
.total b{font-family:'Syne',sans-serif;font-weight:700;font-size:28px}
#pasar{background:var(--navy);color:var(--cream);border:none;border-radius:14px;
  font-family:'Syne',sans-serif;font-weight:700;font-size:19px;padding:16px;cursor:pointer;
  box-shadow:4px 4px 0 rgba(196,216,112,.9)}
#pasar:active{transform:translate(3px,3px);box-shadow:0 0 0 transparent}
#pasar:disabled{opacity:.35}
#pasar small{display:block;font-family:'DM Sans',sans-serif;font-weight:300;font-size:12px;
  color:rgba(249,243,236,.7);margin-top:2px}

/* ── Pendientes (pantalla de cocina) ── */
#pendientes{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
#pendientes .nada{grid-column:1/-1;text-align:center;color:rgba(249,243,236,.5);
  font-size:15px;padding:40px 0}
.orden{background:var(--cream);color:var(--navy);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(4,9,29,.4)}
.orden .cabeza{display:flex;align-items:baseline;gap:10px}
.orden .cabeza .n{font-family:'Syne',sans-serif;font-weight:700;font-size:24px}
.orden .cabeza .quien{font-family:'Syne',sans-serif;font-weight:700;font-size:19px;color:var(--sky);
  text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orden .cabeza .espera{margin-left:auto;font-size:13px;font-weight:500;color:rgba(14,30,86,.55);white-space:nowrap}
.orden.tarda .cabeza .espera{color:var(--shu)}
.orden ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.orden li{font-size:16px;font-weight:500;line-height:1.25}
.orden li b{font-family:'Syne',sans-serif;font-weight:700;margin-right:6px}
.orden li small{display:block;font-weight:300;font-size:13.5px;color:rgba(14,30,86,.65)}
.orden .listo{background:var(--pistacho);color:var(--navy);border:none;border-radius:12px;
  font-family:'Syne',sans-serif;font-weight:700;font-size:17px;padding:13px;cursor:pointer;
  box-shadow:3px 3px 0 rgba(8,18,52,.85)}
.orden .listo:active{transform:translate(2px,2px);box-shadow:0 0 0 transparent}
.orden .otravez{background:none;border:none;color:rgba(14,30,86,.45);font-size:12.5px;
  cursor:pointer;text-decoration:underline}

/* ── Historial (todo lo vendido, no solo lo que falta salir) ── */
.hist-barra{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.hist-barra label{font-size:14px;color:rgba(249,243,236,.6)}
.hist-barra select{background:rgba(249,243,236,.08);color:var(--cream);
  border:1px solid rgba(249,243,236,.22);border-radius:10px;padding:8px 10px;
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500}
.hist-suma{margin-left:auto;font-family:'Syne',sans-serif;font-weight:700;font-size:19px}
.hist-suma small{font-family:'DM Sans',sans-serif;font-weight:300;font-size:13.5px;
  color:rgba(249,243,236,.6);margin-left:8px}
#histLista{display:flex;flex-direction:column;gap:8px}
#histLista .nada{text-align:center;color:rgba(249,243,236,.5);font-size:15px;padding:40px 0}
.venta{background:rgba(249,243,236,.06);border:1px solid rgba(249,243,236,.12);
  border-radius:14px;padding:13px 15px;display:flex;gap:14px;align-items:flex-start}
.venta .col{min-width:0;flex:1}
.venta .arriba{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.venta .n{font-family:'Syne',sans-serif;font-weight:700;font-size:17px}
.venta .hora{font-size:13px;color:rgba(249,243,236,.55)}
.venta .quien{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:var(--sky);
  text-transform:uppercase}
.venta .marca-dscto{font-size:12px;font-weight:500;color:var(--pistacho)}
.venta .marca-cola{font-size:12px;font-weight:500;color:var(--shu)}
.venta .que{font-size:14px;font-weight:300;color:rgba(249,243,236,.78);
  line-height:1.35;margin-top:3px}
.venta .plata{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;white-space:nowrap}
.venta .re{background:none;border:none;color:rgba(249,243,236,.4);font-size:12px;
  cursor:pointer;text-decoration:underline;padding:0;margin-top:4px;display:block}

/* ── Modal ── */
#velo{position:fixed;inset:0;background:rgba(8,18,52,.78);display:flex;
  align-items:flex-end;justify-content:center;z-index:50}
#velo[hidden]{display:none}
#modal{background:var(--cream);color:var(--navy);border-radius:22px 22px 0 0;padding:22px 18px
  calc(22px + env(safe-area-inset-bottom));
  width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
#modal h3{font-family:'Syne',sans-serif;font-weight:700;font-size:22px}
#modal .sub{font-size:14px;color:rgba(14,30,86,.6);margin-top:-8px}
.opciones{display:flex;flex-wrap:wrap;gap:10px}
.opciones button{background:#fff;border:1.5px solid rgba(14,30,86,.25);color:var(--navy);
  border-radius:999px;padding:13px 18px;font-family:'DM Sans',sans-serif;font-weight:500;
  font-size:16px;cursor:pointer}
.opciones button.sel{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.opciones button.grande{font-family:'Syne',sans-serif;font-weight:700;font-size:18px;padding:15px 22px}
#modal .filaLibre{display:flex;gap:10px}
#modal .filaLibre input{flex:1;min-width:0;border:1.5px solid rgba(14,30,86,.25);border-radius:10px;
  background:#fff;padding:11px 12px;font-family:'DM Sans',sans-serif;font-size:16px;color:var(--navy);outline:none}
#modal .acciones{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
#modal .cancelar{background:none;border:none;color:rgba(14,30,86,.5);font-size:14px;cursor:pointer;text-decoration:underline}
#modal .ok{background:var(--navy);color:var(--cream);border:none;border-radius:12px;
  font-family:'Syne',sans-serif;font-weight:700;font-size:16px;padding:13px 24px;cursor:pointer}
#modal .ok:disabled{opacity:.35}
.ajuste-fila{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;
  padding:4px 0;cursor:pointer;user-select:none}
.ajuste-fila input{width:22px;height:22px;accent-color:var(--navy)}

/* ── Escritorio ── */
@media(min-width:900px){
  body{padding-bottom:0}
  #productos{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  main.tomar{display:flex;gap:20px;align-items:flex-start}
  main.tomar #productos{flex:1}
  #barra{display:none}
  #velo-panel{display:none!important}
  #panel{position:sticky;top:16px;transform:none;transition:none;border-radius:18px;
    flex:0 0 360px;max-height:none;box-shadow:0 10px 30px rgba(4,9,29,.45)}
  #panel .asa{display:none}
  #velo{align-items:center;padding:18px}
  #modal{border-radius:18px;width:min(480px,100%)}
}

/* ── Ticket: solo existe al imprimir ── */
#ticket{display:none}
@media print{
  @page{size:80mm auto;margin:0}
  body{background:#fff;padding:0}
  #app,#velo,#velo-panel,#barra{display:none!important}
  #ticket{display:block;width:72mm;margin:0 auto;padding:3mm 0 0;
    color:#000;font-family:'DM Sans',sans-serif}
  #ticket .cab{text-align:center}
  #ticket .cab h1{font-family:'Syne',sans-serif;font-weight:700;font-size:17pt;line-height:1}
  #ticket .cab .sub{font-size:8.5pt;font-weight:300;margin-top:1mm}
  #ticket .meta{display:flex;justify-content:space-between;font-size:9pt;font-weight:500;
    margin-top:3mm;padding-top:2mm;border-top:1.5px dashed #000}
  #ticket .items{margin-top:2mm;padding:2mm 0;border-top:1.5px dashed #000;border-bottom:1.5px dashed #000}
  #ticket .it{display:flex;gap:2mm;font-size:11.5pt;font-weight:500;line-height:1.25;margin:1.2mm 0}
  #ticket .it .q{min-width:6mm;font-family:'Syne',sans-serif;font-weight:700}
  #ticket .it .d small{display:block;font-size:9.5pt;font-weight:300}
  #ticket .it .p{margin-left:auto;font-size:9.5pt;font-weight:300;white-space:nowrap}
  #ticket .para{margin-top:3mm;font-size:9pt}
  #ticket .para b{display:block;font-family:'Syne',sans-serif;font-weight:700;font-size:20pt;line-height:1.05}
  #ticket .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:3mm}
  #ticket .tot span{font-size:10pt;font-weight:500}
  #ticket .tot b{font-family:'Syne',sans-serif;font-weight:700;font-size:16pt}
  #ticket .dscto{font-size:9pt;font-weight:300;margin-top:1mm}
  #ticket .pie{text-align:center;font-size:8.5pt;font-weight:300;margin-top:4mm}
  /* Cola de papel: la barra de corte queda ~2 cm mas abajo que el cabezal
     termico, asi que sin esto el tijeretazo pasa por encima del pie.
     Son lineas reales y no padding porque el padding del final lo recorta
     el driver cuando la pagina es de alto automatico. */
  #ticket .feed{font-size:10pt;line-height:5mm;text-align:center}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="arriba">
      <span class="marca">THE DAILY <i>GRIND</i></span>
      <span class="chip">La Comanda · ART STGO '26</span>
      <span class="dia" id="resumenDia"></span>
      <button class="ajustes" id="btnAjustes">ajustes</button>
    </div>
    <nav class="pestanas">
      <button id="tabTomar" class="viva">Tomar pedido</button>
      <button id="tabCocina">En cola<span class="globo" id="globoCola"></span></button>
      <button id="tabHistorial">Historial</button>
    </nav>
  </header>

  <main id="vistaTomar" class="tomar">
    <section id="productos"></section>
    <aside id="panel">
      <div class="asa"></div>
      <div class="num"><b id="numPedido">Pedido #1</b><span id="horaAhora"></span></div>
      <div id="lineas"></div>
      <label class="nombre">nombre para gritar el pedido
        <input type="text" id="nombreCliente" placeholder="opcional" autocomplete="off">
      </label>
      <div class="dsctos" id="dsctos">
        <button data-d="" class="sel">sin dscto</button>
        <button data-d="dailyback">10% DailyBack</button>
        <button data-d="amigos">20% Amigos</button>
      </div>
      <div class="total"><span>Total</span><b id="totalPedido">$0</b></div>
      <button id="pasar" disabled>Pasar a cocina<small id="pasarNota"></small></button>
    </aside>
  </main>

  <main id="vistaCocina" hidden>
    <section id="pendientes"></section>
  </main>

  <main id="vistaHistorial" hidden>
    <section id="historial">
      <div class="hist-barra">
        <label>día <select id="histDia"></select></label>
        <span class="hist-suma" id="histSuma"></span>
      </div>
      <div id="histLista"></div>
    </section>
  </main>
</div>

<div id="velo-panel" hidden></div>
<div id="velo" hidden><div id="modal"></div></div>
<div id="ticket"></div>

<script>
"use strict";

var SABORES = ["Mango","Vainilla","Cookies & cream","Snickers","Frambuesa","Chocolate"];
var PRODUCTOS = [
  {id:"best", nombre:"The Best", tipo:"acai", det:"açaí · condensada · granola",
    precios:[["266 ml",5990],["355 ml",7590]]},
  {id:"one", nombre:"The One", tipo:"acai", det:"açaí · leche en polvo · yoghurt",
    precios:[["266 ml",5990],["355 ml",7590]]},
  {id:"b1", nombre:"Helado una bolita", tipo:"helado1", det:"el sabor que quieras", precio:3590},
  {id:"b2", nombre:"Helado dos bolitas", tipo:"helado2", det:"dos sabores", precio:4090},
  {id:"duo", nombre:"Dúo de feria", tipo:"combo", det:"açaí 266 ml + una bolita · ahorra $1.090", precio:8490},
  {id:"top", nombre:"Topping extra", tipo:"topping", det:"premium, el que quieran", precio:690},
  {id:"otro", nombre:"Otro", tipo:"libre", det:"lo que sea, precio a mano"}
];

var CLAVE = "laComandaDG";
function cargar(){
  try {
    var d = JSON.parse(localStorage.getItem(CLAVE));
    if (d && d.seq) return d;
  } catch(e){}
  return {seq:1, ventas:[], imprime:false};
}
function guardar(){ localStorage.setItem(CLAVE, JSON.stringify(datos)); }
var datos = cargar();
var pedido = [];   // {desc, extra, precio, qty}

function plata(n){ return "$" + Math.round(n).toLocaleString("es-CL"); }
function hoy(){ return new Date().toLocaleDateString("es-CL"); }
function ahora(){ return new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"}); }

/* ── Pestañas ── */
var VISTAS = {
  tomar:     {vista:"vistaTomar",     tab:"tabTomar"},
  cocina:    {vista:"vistaCocina",    tab:"tabCocina"},
  historial: {vista:"vistaHistorial", tab:"tabHistorial"}
};
function mostrar(cual){
  Object.keys(VISTAS).forEach(function(k){
    var v = VISTAS[k];
    document.getElementById(v.vista).hidden = (k !== cual);
    document.getElementById(v.tab).classList.toggle("viva", k === cual);
  });
  if (cual === "cocina") pintarCola();
  if (cual === "historial") pintarHistorial();
}
Object.keys(VISTAS).forEach(function(k){
  document.getElementById(VISTAS[k].tab)
    .addEventListener("click", function(){ mostrar(k); });
});

/* ── Productos ── */
var elProductos = document.getElementById("productos");
PRODUCTOS.forEach(function(p){
  var b = document.createElement("button");
  b.className = "prod" + (p.tipo === "libre" ? " libre" : "") + (p.tipo === "combo" ? " promo" : "");
  var desde = p.precios ? "desde " + plata(p.precios[0][1]) : (p.precio ? plata(p.precio) : "");
  b.innerHTML = "<h3></h3><span class='det'></span><span class='desde'></span>";
  b.querySelector("h3").textContent = p.nombre;
  b.querySelector(".det").textContent = p.det;
  b.querySelector(".desde").textContent = desde;
  b.addEventListener("click", function(){ elegir(p); });
  elProductos.appendChild(b);
});

/* ── Modal ── */
var velo = document.getElementById("velo");
var modal = document.getElementById("modal");
function cerrarModal(){ velo.hidden = true; modal.innerHTML = ""; }
velo.addEventListener("click", function(ev){ if (ev.target === velo) cerrarModal(); });

function elegir(p){
  if (p.tipo === "acai") return modalTamano(p);
  if (p.tipo === "helado1") return modalSabores(p, 1);
  if (p.tipo === "helado2") return modalSabores(p, 2);
  if (p.tipo === "combo") return modalCombo(p);
  if (p.tipo === "topping") return modalTopping(p);
  if (p.tipo === "libre") return modalLibre();
  agregar(p.nombre, "", p.precio);
}

function modalCombo(p){
  modal.innerHTML = "<h3></h3><div class='sub'>primero: cuál açaí (266 ml)</div>" +
    "<div class='opciones'></div>" +
    "<div class='acciones'><button class='cancelar'>cancelar</button></div>";
  modal.querySelector("h3").textContent = p.nombre;
  var ops = modal.querySelector(".opciones");
  ["The Best","The One"].forEach(function(acai){
    var b = document.createElement("button");
    b.className = "grande";
    b.textContent = acai;
    b.addEventListener("click", function(){
      modal.querySelector(".sub").textContent = "ahora: el sabor de la bolita";
      ops.innerHTML = "";
      SABORES.forEach(function(s){
        var bs = document.createElement("button");
        bs.textContent = s;
        bs.addEventListener("click", function(){
          agregar(p.nombre, acai + " 266 + bolita " + s, p.precio);
          cerrarModal();
        });
        ops.appendChild(bs);
      });
    });
    ops.appendChild(b);
  });
  modal.querySelector(".cancelar").addEventListener("click", cerrarModal);
  velo.hidden = false;
}

function modalTamano(p){
  modal.innerHTML = "<h3></h3><div class='sub'></div><div class='opciones'></div>" +
    "<div class='acciones'><button class='cancelar'>cancelar</button></div>";
  modal.querySelector("h3").textContent = p.nombre;
  modal.querySelector(".sub").textContent = p.det;
  var ops = modal.querySelector(".opciones");
  p.precios.forEach(function(par){
    var b = document.createElement("button");
    b.className = "grande";
    b.textContent = par[0] + " · " + plata(par[1]);
    b.addEventListener("click", function(){
      agregar(p.nombre + " · " + par[0], "", par[1]); cerrarModal();
    });
    ops.appendChild(b);
  });
  modal.querySelector(".cancelar").addEventListener("click", cerrarModal);
  velo.hidden = false;
}

function modalSabores(p, cuantos){
  modal.innerHTML = "<h3></h3><div class='sub'></div><div class='opciones'></div>" +
    "<div class='acciones'><button class='cancelar'>cancelar</button>" +
    "<button class='ok' disabled>Agregar</button></div>";
  modal.querySelector("h3").textContent = p.nombre;
  modal.querySelector(".sub").textContent = (cuantos === 1) ?
    "elige el sabor" : "elige dos (toca dos veces si repite)";
  var ops = modal.querySelector(".opciones");
  var ok = modal.querySelector(".ok");
  var sel = [];
  SABORES.forEach(function(s){
    var b = document.createElement("button");
    b.dataset.sabor = s;
    b.textContent = s;
    b.addEventListener("click", function(){
      if (cuantos === 1){ agregar(p.nombre, s, p.precio); cerrarModal(); return; }
      sel.push(s);
      if (sel.length > cuantos) sel.shift();
      var vivos = {};
      sel.forEach(function(x){ vivos[x] = (vivos[x]||0)+1; });
      ops.querySelectorAll("button").forEach(function(bb){
        var base = bb.dataset.sabor;
        bb.classList.toggle("sel", !!vivos[base]);
        bb.textContent = base + (vivos[base] === 2 ? " ×2" : "");
      });
      ok.disabled = (sel.length !== cuantos);
    });
    ops.appendChild(b);
  });
  ok.addEventListener("click", function(){
    agregar(p.nombre, sel.join(" + "), p.precio); cerrarModal();
  });
  modal.querySelector(".cancelar").addEventListener("click", cerrarModal);
  velo.hidden = false;
}

function modalTopping(p){
  modal.innerHTML = "<h3>Topping extra</h3><div class='sub'>+" + plata(p.precio) + " cada uno</div>" +
    "<div class='opciones'></div>" +
    "<div class='filaLibre'><input type='text' id='topNom' placeholder='u otro: cuál'></div>" +
    "<div class='acciones'><button class='cancelar'>cancelar</button>" +
    "<button class='ok'>Agregar</button></div>";
  var ops = modal.querySelector(".opciones");
  ["Granola","Leche condensada"].forEach(function(s){
    var b = document.createElement("button");
    b.textContent = s;
    b.addEventListener("click", function(){
      agregar(p.nombre, s, p.precio); cerrarModal();
    });
    ops.appendChild(b);
  });
  var nom = modal.querySelector("#topNom");
  modal.querySelector(".ok").addEventListener("click", function(){
    agregar(p.nombre, nom.value.trim(), p.precio); cerrarModal();
  });
  modal.querySelector(".cancelar").addEventListener("click", cerrarModal);
  velo.hidden = false;
}

function modalLibre(){
  modal.innerHTML = "<h3>Otro</h3><div class='sub'>lo que no está en la carta</div>" +
    "<div class='filaLibre'><input type='text' id='libreNom' placeholder='qué es'>" +
    "<input type='text' id='librePre' placeholder='precio' inputmode='numeric' style='max-width:110px'></div>" +
    "<div class='acciones'><button class='cancelar'>cancelar</button>" +
    "<button class='ok'>Agregar</button></div>";
  var nom = modal.querySelector("#libreNom"), pre = modal.querySelector("#librePre");
  modal.querySelector(".ok").addEventListener("click", function(){
    var precio = parseInt(String(pre.value).replace(/[^0-9]/g,""), 10);
    if (!nom.value.trim() || !Number.isFinite(precio)) return;
    agregar(nom.value.trim(), "", precio); cerrarModal();
  });
  modal.querySelector(".cancelar").addEventListener("click", cerrarModal);
  velo.hidden = false;
  nom.focus();
}

/* ── Hoja del pedido (móvil) ── */
var panel = document.getElementById("panel");
var veloPanel = document.getElementById("velo-panel");
var esMovil = function(){ return window.innerWidth < 900; };
function abrirPanel(){
  if (!esMovil()) return;
  veloPanel.hidden = false;
  requestAnimationFrame(function(){ panel.classList.add("abierto"); });
}
function cerrarPanel(){
  panel.classList.remove("abierto");
  veloPanel.hidden = true;
}
veloPanel.addEventListener("click", cerrarPanel);

/* ── El pedido ── */
function agregar(desc, extra, precio){
  var igual = pedido.find(function(l){ return l.desc === desc && l.extra === extra; });
  if (igual) igual.qty += 1;
  else pedido.push({desc:desc, extra:extra, precio:precio, qty:1});
  pintarPedido();
}

var elLineas = document.getElementById("lineas");
var elTotal = document.getElementById("totalPedido");
var btnPasar = document.getElementById("pasar");
var elBarra = null;

var dscto = "";
var FACTOR = { "": 1, dailyback: 0.9, amigos: 0.8 };
var elDsctos = document.getElementById("dsctos");
elDsctos.addEventListener("click", function(ev){
  var b = ev.target.closest("button");
  if (!b) return;
  dscto = b.dataset.d;
  elDsctos.querySelectorAll("button").forEach(function(bb){
    bb.classList.toggle("sel", bb === b);
  });
  pintarPedido();
});
function limpiarDscto(){
  dscto = "";
  elDsctos.querySelectorAll("button").forEach(function(bb){
    bb.classList.toggle("sel", bb.dataset.d === "");
  });
}

function totalPedido(){
  var t = pedido.reduce(function(s,l){ return s + l.precio*l.qty; }, 0);
  var f = FACTOR[dscto] || 1;
  if (f !== 1) t = Math.round(t*f/10)*10;
  return t;
}
function cuantasCosas(){
  return pedido.reduce(function(s,l){ return s + l.qty; }, 0);
}

function pintarPedido(){
  elLineas.innerHTML = "";
  if (!pedido.length){
    elLineas.innerHTML = "<div class='vacio'>toca un producto para partir</div>";
  }
  pedido.forEach(function(l, i){
    var fila = document.createElement("div");
    fila.className = "linea";
    fila.innerHTML = "<span class='qty'></span><span class='desc'></span>" +
      "<span class='precio'></span><button class='mas'>+</button><button class='quitar'>×</button>";
    fila.querySelector(".qty").textContent = l.qty;
    var d = fila.querySelector(".desc");
    d.textContent = l.desc;
    if (l.extra){ var s = document.createElement("small"); s.textContent = l.extra; d.appendChild(s); }
    fila.querySelector(".precio").textContent = plata(l.precio*l.qty);
    fila.querySelector(".mas").addEventListener("click", function(){ l.qty += 1; pintarPedido(); });
    fila.querySelector(".quitar").addEventListener("click", function(){
      l.qty -= 1;
      if (l.qty <= 0) pedido.splice(i,1);
      pintarPedido();
      if (!pedido.length) cerrarPanel();
    });
    elLineas.appendChild(fila);
  });
  elTotal.textContent = plata(totalPedido());
  btnPasar.disabled = !pedido.length;
  document.getElementById("numPedido").textContent = "Pedido #" + datos.seq;
  document.getElementById("pasarNota").textContent =
    datos.imprime ? "se imprime la comanda" : "queda en la cola de la pantalla";
  if (elBarra){
    elBarra.querySelector(".resumen").innerHTML =
      cuantasCosas() + " cosas<b>" + plata(totalPedido()) + "</b>";
    elBarra.querySelector("button").disabled = !pedido.length;
  }
}

/* barra inferior móvil */
(function(){
  elBarra = document.createElement("div");
  elBarra.id = "barra";
  elBarra.innerHTML = "<span class='resumen'>0 cosas<b>$0</b></span><button disabled>Ver pedido →</button>";
  elBarra.querySelector("button").addEventListener("click", abrirPanel);
  document.body.appendChild(elBarra);
})();

function pintarDia(){
  var deHoy = datos.ventas.filter(function(v){ return v.fecha === hoy(); });
  var t = deHoy.reduce(function(s,v){ return s + v.total; }, 0);
  document.getElementById("resumenDia").innerHTML =
    "hoy: <b>" + deHoy.length + "</b> · <b>" + plata(t) + "</b>";
}

/* ── La cola (pantalla de cocina) ── */
var elPendientes = document.getElementById("pendientes");
function pendientesHoy(){
  return datos.ventas.filter(function(v){ return v.fecha === hoy() && v.estado === "pendiente"; });
}
function pintarGlobo(){
  document.getElementById("globoCola").textContent = pendientesHoy().length || "";
}
function minutosDesde(v){
  return Math.max(0, Math.round((Date.now() - v.t) / 60000));
}
function pintarCola(){
  var cola = pendientesHoy();
  elPendientes.innerHTML = "";
  if (!cola.length){
    elPendientes.innerHTML = "<div class='nada'>nada en cola — todo entregado ✓</div>";
  }
  cola.forEach(function(v){
    var min = minutosDesde(v);
    var card = document.createElement("div");
    card.className = "orden" + (min >= 8 ? " tarda" : "");
    card.innerHTML = "<div class='cabeza'><span class='n'>#" + v.n + "</span>" +
      "<span class='quien'></span><span class='espera'>" +
      (min < 1 ? "recién" : "hace " + min + " min") + "</span></div>" +
      "<ul></ul>" +
      "<button class='listo'>Listo, entregado ✓</button>" +
      (datos.imprime ? "<button class='otravez'>imprimir de nuevo</button>" : "");
    card.querySelector(".quien").textContent = v.nombre || "";
    var ul = card.querySelector("ul");
    v.lineas.forEach(function(l){
      var li = document.createElement("li");
      var b = document.createElement("b"); b.textContent = l.qty + "×";
      li.appendChild(b);
      li.appendChild(document.createTextNode(l.desc));
      if (l.extra){ var s = document.createElement("small"); s.textContent = l.extra; li.appendChild(s); }
      ul.appendChild(li);
    });
    card.querySelector(".listo").addEventListener("click", function(){
      v.estado = "listo";
      guardar(); pintarCola(); pintarGlobo();
    });
    var otra = card.querySelector(".otravez");
    if (otra) otra.addEventListener("click", function(){ armarTicket(v); window.print(); });
    elPendientes.appendChild(card);
  });
  pintarGlobo();
}

/* ── Historial (todo lo vendido, no solo lo que falta salir) ── */
var elHistDia = document.getElementById("histDia");
var elHistLista = document.getElementById("histLista");
var elHistSuma = document.getElementById("histSuma");

/* Se ordena por el timestamp de la venta y no por el texto de la fecha:
   "22-08-2026" ordenado como string pone marzo antes que febrero. */
function diasConVentas(){
  var mapa = {};
  datos.ventas.forEach(function(v){
    if (!mapa[v.fecha] || (v.t || 0) > mapa[v.fecha]) mapa[v.fecha] = v.t || 0;
  });
  return Object.keys(mapa).sort(function(a,b){ return mapa[b] - mapa[a]; });
}

function pintarHistorial(){
  var dias = diasConVentas();
  if (!dias.length){
    elHistDia.innerHTML = "";
    elHistSuma.textContent = "";
    elHistLista.innerHTML = "<div class='nada'>todavía no hay ventas</div>";
    return;
  }
  var elegido = elHistDia.value;
  if (dias.indexOf(elegido) === -1) elegido = (dias.indexOf(hoy()) !== -1) ? hoy() : dias[0];
  elHistDia.innerHTML = "";
  dias.forEach(function(d){
    var o = document.createElement("option");
    o.value = d;
    o.textContent = (d === hoy() ? "hoy · " : "") + d;
    elHistDia.appendChild(o);
  });
  elHistDia.value = elegido;

  var delDia = datos.ventas.filter(function(v){ return v.fecha === elegido; })
    .slice().sort(function(a,b){ return (b.t || 0) - (a.t || 0); });
  var suma = delDia.reduce(function(s,v){ return s + v.total; }, 0);
  elHistSuma.innerHTML = plata(suma) + "<small></small>";
  elHistSuma.querySelector("small").textContent =
    delDia.length + (delDia.length === 1 ? " pedido" : " pedidos");

  elHistLista.innerHTML = "";
  delDia.forEach(function(v){
    var fila = document.createElement("div");
    fila.className = "venta";
    fila.innerHTML = "<div class='col'><div class='arriba'>" +
      "<span class='n'>#" + v.n + "</span><span class='hora'></span>" +
      "<span class='quien'></span>" +
      (v.dscto ? "<span class='marca-dscto'></span>" : "") +
      (v.estado === "pendiente" ? "<span class='marca-cola'>en cola</span>" : "") +
      "</div><div class='que'></div></div>" +
      "<div><div class='plata'></div>" +
      (datos.imprime ? "<button class='re'>reimprimir</button>" : "") + "</div>";
    fila.querySelector(".hora").textContent = v.hora;
    fila.querySelector(".quien").textContent = v.nombre || "";
    var md = fila.querySelector(".marca-dscto");
    if (md) md.textContent = (v.dscto === "amigos" ? "20% amigos" : "10% DailyBack");
    fila.querySelector(".que").textContent = v.lineas.map(function(l){
      return l.qty + "× " + l.desc + (l.extra ? " (" + l.extra + ")" : "");
    }).join(" · ");
    fila.querySelector(".plata").textContent = plata(v.total);
    var re = fila.querySelector(".re");
    if (re) re.addEventListener("click", function(){ armarTicket(v); window.print(); });
    elHistLista.appendChild(fila);
  });
}
elHistDia.addEventListener("change", pintarHistorial);

/* ── Pasar a cocina ── */
function armarTicket(v){
  var t = document.getElementById("ticket");
  t.innerHTML = "<div class='cab'><h1>THE DAILY GRIND</h1>" +
    "<div class='sub'>comanda de feria · ART STGO · GAM</div></div>" +
    "<div class='meta'><span>#" + v.n + "</span><span>" + v.fecha + "</span><span>" + v.hora + "</span></div>" +
    "<div class='items'></div>" +
    (v.nombre ? "<div class='para'>para<b></b></div>" : "") +
    "<div class='tot'><span>TOTAL</span><b>" + plata(v.total) + "</b></div>" +
    (v.dscto === "amigos" ? "<div class='dscto'>con 20% amigos de la casa</div>" :
     v.dscto ? "<div class='dscto'>con 10% DailyBack aplicado</div>" : "") +
    "<div class='pie'>dailygrind.cl · @dailygrind.cl</div>" +
    "<div class='feed'>&nbsp;<br>&nbsp;<br>&nbsp;<br>&nbsp;<br>&nbsp;</div>";
  var items = t.querySelector(".items");
  v.lineas.forEach(function(l){
    var fila = document.createElement("div");
    fila.className = "it";
    fila.innerHTML = "<span class='q'></span><span class='d'></span><span class='p'></span>";
    fila.querySelector(".q").textContent = l.qty;
    var d = fila.querySelector(".d");
    d.textContent = l.desc;
    if (l.extra){ var s = document.createElement("small"); s.textContent = l.extra; d.appendChild(s); }
    fila.querySelector(".p").textContent = plata(l.precio*l.qty);
    items.appendChild(fila);
  });
  if (v.nombre) t.querySelector(".para b").textContent = v.nombre.toUpperCase();
}

btnPasar.addEventListener("click", function(){
  if (!pedido.length) return;
  var v = {
    n: datos.seq, fecha: hoy(), hora: ahora(), t: Date.now(), estado: "pendiente",
    lineas: pedido.map(function(l){ return {desc:l.desc, extra:l.extra, precio:l.precio, qty:l.qty}; }),
    total: totalPedido(), dscto: dscto,
    nombre: document.getElementById("nombreCliente").value.trim()
  };
  datos.ventas.push(v);
  datos.seq += 1;
  guardar();
  if (datos.imprime){ armarTicket(v); window.print(); }
  pedido = [];
  limpiarDscto();
  document.getElementById("nombreCliente").value = "";
  cerrarPanel();
  pintarPedido(); pintarDia(); pintarGlobo();
});

/* ── Ajustes ── */
document.getElementById("btnAjustes").addEventListener("click", function(){
  modal.innerHTML = "<h3>Ajustes</h3>" +
    "<label class='ajuste-fila'><input type='checkbox' id='ajImprime'>" +
    "<span>Imprimir comanda en la impresora<br><small style='font-weight:300;color:rgba(14,30,86,.55)'>" +
    "apagado = las comandas quedan solo en la pantalla En cola</small></span></label>" +
    "<p style='font-size:12.5px;font-weight:300;color:rgba(14,30,86,.6);margin:0;line-height:1.4'>" +
    "¿Sale el cuadro de imprimir cada vez? Es el navegador, no La Comanda: " +
    "ninguna página puede saltárselo por su cuenta. Abrir Chrome con el " +
    "acceso <b>Abrir La Comanda</b> del escritorio y el papel sale solo.</p>" +
    "<div class='opciones' style='flex-direction:column;align-items:stretch'>" +
    "<button id='ajPrueba'>Impresión de prueba</button>" +
    "<button id='ajCierre'>Cierre del día (bajar planilla)</button>" +
    "<button id='ajBorrar'>Borrar las ventas de hoy</button></div>" +
    "<div class='acciones'><button class='cancelar'>cerrar</button></div>";
  var chk = modal.querySelector("#ajImprime");
  chk.checked = !!datos.imprime;
  chk.addEventListener("change", function(){
    datos.imprime = chk.checked; guardar(); pintarPedido();
  });
  modal.querySelector(".cancelar").addEventListener("click", cerrarModal);
  modal.querySelector("#ajPrueba").addEventListener("click", function(){
    armarTicket({n:0, fecha:hoy(), hora:ahora(), total:0, dscto:false, nombre:"PRUEBA",
      lineas:[{desc:"Si lees esto, la impresora quedó lista", extra:"", precio:0, qty:1}]});
    window.print();
  });
  modal.querySelector("#ajCierre").addEventListener("click", function(){
    var deHoy = datos.ventas.filter(function(v){ return v.fecha === hoy(); });
    if (!deHoy.length){ alert("Hoy no hay ventas todavía."); return; }
    var filas = ["fecha;hora;pedido;producto;detalle;cantidad;precio;total_pedido;descuento;nombre"];
    deHoy.forEach(function(v){
      v.lineas.forEach(function(l){
        filas.push([v.fecha, v.hora, v.n, l.desc, l.extra, l.qty, l.precio,
          v.total, v.dscto === "amigos" ? "amigos 20" : v.dscto ? "dailyback 10" : "",
          v.nombre].join(";"));
      });
    });
    var blob = new Blob(["﻿" + filas.join("\n")], {type:"text/csv;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ventas-daily-grind-" + hoy().replace(/\//g,"-") + ".csv";
    a.click();
  });
  modal.querySelector("#ajBorrar").addEventListener("click", function(){
    if (!confirm("¿Borrar las ventas de hoy? Baja la planilla primero.")) return;
    datos.ventas = datos.ventas.filter(function(v){ return v.fecha !== hoy(); });
    datos.seq = 1;
    guardar(); pintarDia(); pintarPedido(); pintarGlobo(); pintarCola();
    pintarHistorial(); cerrarModal();
  });
  velo.hidden = false;
});

/* Reloj, cola viva y arranque */
function tic(){
  document.getElementById("horaAhora").textContent = ahora();
  if (!document.getElementById("vistaCocina").hidden) pintarCola();
}
tic(); setInterval(tic, 30000);
pintarPedido(); pintarDia(); pintarGlobo();
</script>
</body>
