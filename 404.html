<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Esta no existe — The Daily Grind</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/LogoTDG.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/azul.css" />
  <style>
    /* Una página de error es una pausa que nadie pidió. Que al menos valga la
       pena: acá el logotipo hace de bolitas y el barquillo de cono, que es la
       única parte del sitio donde la marca se dibuja entera. */
    .perdido {
      min-height: 72vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 26px;
      padding-block: 48px;
    }
    /* Los dos cuelgan del mismo ancho, así el cono sube lo mismo a cualquier
       tamaño. El SVG del logotipo trae aire abajo y por eso el -22%. */
    .helado { width: 190px; max-width: 58vw; }
    .helado img { width: 100%; display: block; }
    .helado svg {
      width: 70%;
      margin: -22% auto 0;
      display: block;
      color: var(--papel);
    }
    .perdido h1 { font-size: clamp(34px, 7vw, 64px); max-width: none; }
    .perdido p { font-size: 16px; font-weight: 300; max-width: 42ch; }
  </style>
</head>
<body>
  <div class="franja">
    <div class="ancho">
      <a class="dato" href="/">← La casa</a>
      <span class="dato sep" aria-hidden="true">·</span>
      <span class="dato"><b>Esta página no existe</b></span>
    </div>
  </div>

  <main>
    <section>
      <div class="ancho perdido">
        <div class="helado">
          <img src="/LogoTDG.svg" alt="The Daily Grind" />
          <!-- El barquillo va más angosto que el logotipo para que el script se
               desborde por los lados, como se desborda el helado. Al ancho del
               logotipo lee como embudo. -->
          <svg viewBox="0 0 120 86" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="6"
               stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 6 L60 80 L114 6"/>
              <path d="M26 10 L54 48 M50 8 L78 46 M74 10 L94 36
                       M94 10 L70 44 M70 8 L42 46 M46 10 L26 36"/>
            </g>
          </svg>
        </div>

        <h1>Esta no existe.</h1>
        <p>
          El link llegó a una dirección que no está. La carta sí está, y la
          votación también.
        </p>

        <div class="fila-botones" style="justify-content:center">
          <a class="boton" href="/menu">Ver la carta →</a>
          <a class="boton boton--linea" href="/">Volver a la casa →</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="ancho">
      <span class="dato">The Daily Grind · Vol. 4 · MMXXVI</span>
      <span class="dato"><a href="/votacion">Votar tu helado →</a> · <a href="https://www.instagram.com/dailygrind.cl/">@dailygrind.cl ↗</a></span>
    </div>
  </footer>
  <script src="/azul.js"></script>
</body>
</html>
