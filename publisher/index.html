<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1e56">
<meta name="robots" content="noindex,nofollow">
<title>Daily Grind · Publisher</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,500;1,300&family=Syne:wght@400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

<style>
  :root {
    --navy:    #0e1e56;
    --navy-2:  #0b1845;
    --navy-3:  #08123a;
    --sky:     #51b5f2;
    --sky-lt:  #a6d9f8;
    --sky-mute: rgba(166,217,248,.65);
    --sky-soft: rgba(166,217,248,.22);
    --sky-line: rgba(166,217,248,.18);
    --cream:   #f9f3ec;
    --beige:   #e3ded9;
    --red:     #ff7a5c;
    --green:   #8de28f;
    --display: "Syne", ui-sans-serif, system-ui, sans-serif;
    --body:    "DM Sans", ui-sans-serif, system-ui, sans-serif;
    --mono:    "JetBrains Mono", ui-monospace, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--navy); color: var(--cream); font-family: var(--body); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; }

  /* ── Shell ────────────────────────────── */
  .shell { width: 100%; max-width: 1100px; margin: 0 auto; padding: 36px 24px 96px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .label { font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--sky); font-weight: 500; }
  .label--muted { color: var(--sky-mute); }
  .mono { font-family: var(--mono); font-size: 12px; letter-spacing: .02em; }

  .head {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
    padding-bottom: 28px; margin-bottom: 36px; border-bottom: 1px solid var(--sky-line);
  }
  .head__brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .head__title { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.01em; line-height: 1; }
  .head__title em { font-family: var(--body); font-style: italic; font-weight: 300; color: var(--sky); }
  .head__sub { color: var(--sky-mute); font-weight: 300; font-size: 13px; }
  .head__meta { display: flex; gap: 18px; color: var(--sky-mute); font-size: 12px; align-items: center; }
  .head__logout { background: none; border: 1px solid var(--sky-soft); color: var(--cream); padding: 8px 14px; border-radius: 6px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; transition: border-color .2s; }
  .head__logout:hover { border-color: var(--sky); }

  /* ── Sección ──────────────────────────── */
  section { margin-bottom: 56px; }
  .section__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; gap: 16px; }
  .section__title { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 3vw, 30px); letter-spacing: -.005em; }
  .section__count { color: var(--sky-mute); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }

  /* ── Gate ─────────────────────────────── */
  .gate { max-width: 460px; margin: 80px auto 0; padding: 0 24px; }
  .gate__brand { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1; margin-bottom: 8px; }
  .gate__brand em { font-family: var(--body); font-style: italic; font-weight: 300; color: var(--sky); }
  .gate__sub { color: var(--sky-mute); font-size: 13px; margin-bottom: 36px; }
  .gate__form { display: flex; flex-direction: column; gap: 14px; }
  .gate__input { background: transparent; border: 1px solid var(--sky-soft); border-radius: 8px; padding: 16px 18px; color: var(--cream); font-size: 16px; letter-spacing: .04em; transition: border-color .2s; }
  .gate__input:focus { outline: none; border-color: var(--sky); }
  .gate__err { color: var(--red); font-size: 13px; min-height: 16px; }
  .btn { background: var(--sky); color: var(--navy); border: none; border-radius: 8px; padding: 14px 18px; font-weight: 500; letter-spacing: .04em; transition: opacity .2s; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn--ghost { background: transparent; color: var(--cream); border: 1px solid var(--sky-soft); }
  .btn--ghost:hover { border-color: var(--sky); }
  .btn--danger { background: transparent; color: var(--red); border: 1px solid rgba(255,122,92,.4); }
  .btn--danger:hover { border-color: var(--red); }

  /* ── Compositor ───────────────────────── */
  .composer { background: var(--navy-2); border: 1px solid var(--sky-line); border-radius: 12px; padding: 24px; }
  .composer__kinds { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .kind-card { background: transparent; border: 1px solid var(--sky-soft); border-radius: 8px; padding: 14px 12px; color: var(--cream); text-align: left; transition: all .2s; }
  .kind-card:hover { border-color: var(--sky-lt); }
  .kind-card[aria-selected="true"] { background: var(--sky); color: var(--navy); border-color: var(--sky); }
  .kind-card__name { font-weight: 500; font-size: 14px; margin-bottom: 4px; }
  .kind-card__hint { font-size: 11px; opacity: .75; letter-spacing: .04em; }

  .form-row { margin-bottom: 16px; }
  .form-label { display: block; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--sky); margin-bottom: 8px; }
  .form-input, .form-textarea { width: 100%; background: var(--navy-3); border: 1px solid var(--sky-soft); border-radius: 8px; padding: 12px 14px; color: var(--cream); font-size: 14px; }
  .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--sky); }
  .form-textarea { min-height: 96px; resize: vertical; line-height: 1.5; }

  .drop {
    border: 1px dashed var(--sky-soft); border-radius: 8px; padding: 20px; text-align: center;
    background: var(--navy-3); transition: all .2s; cursor: pointer; min-height: 120px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .drop:hover, .drop--over { border-color: var(--sky); background: var(--navy-2); }
  .drop__title { font-size: 14px; color: var(--cream); }
  .drop__hint { font-size: 12px; color: var(--sky-mute); }
  .drop input[type=file] { display: none; }
  .drop__preview { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .preview { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; border: 1px solid var(--sky-soft); }

  .when-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .when-row { grid-template-columns: 1fr; } }

  .composer__actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .composer__status { font-size: 12px; color: var(--sky-mute); margin-top: 12px; min-height: 18px; }
  .composer__status--err { color: var(--red); }
  .composer__status--ok { color: var(--green); }

  /* ── Cola ─────────────────────────────── */
  .item-list { display: flex; flex-direction: column; gap: 12px; }
  .item {
    background: var(--navy-2); border: 1px solid var(--sky-line); border-radius: 10px;
    padding: 16px; display: grid; grid-template-columns: 84px 1fr auto; gap: 14px; align-items: start;
  }
  @media (max-width: 480px) { .item { grid-template-columns: 64px 1fr; } .item__actions { grid-column: 1/-1; } }
  .item__thumb {
    width: 84px; height: 84px; border-radius: 8px; background: var(--navy-3);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .item__thumb img, .item__thumb video { width: 100%; height: 100%; object-fit: cover; }
  .item__thumb-text { font-family: var(--display); font-size: 11px; letter-spacing: .2em; color: var(--sky-mute); padding: 8px; text-align: center; }
  .item__body { min-width: 0; }
  .item__meta { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .badge { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; font-weight: 500; }
  .badge--fb { background: rgba(81,181,242,.18); color: var(--sky-lt); }
  .badge--ig { background: rgba(255,122,92,.18); color: #ffb59c; }
  .badge--pending { background: var(--sky-soft); color: var(--cream); }
  .badge--retrying { background: rgba(255,200,80,.18); color: #ffd28a; }
  .badge--published { background: rgba(141,226,143,.16); color: var(--green); }
  .badge--failed { background: rgba(255,122,92,.18); color: var(--red); }
  .item__when { font-family: var(--mono); font-size: 12px; color: var(--sky-mute); }
  .item__caption { font-size: 14px; line-height: 1.5; color: var(--cream); margin-top: 6px; word-wrap: break-word; }
  .item__caption--muted { color: var(--sky-mute); font-style: italic; }
  .item__err { font-size: 12px; color: var(--red); margin-top: 4px; font-family: var(--mono); }
  .item__actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .item__btn { background: none; border: 1px solid var(--sky-soft); color: var(--cream); padding: 6px 10px; border-radius: 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; transition: border-color .2s; }
  .item__btn:hover { border-color: var(--sky); }
  .item__btn--danger:hover { border-color: var(--red); color: var(--red); }
  .item__link { color: var(--sky); font-size: 12px; text-decoration: underline; }
  .stats {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--sky-soft);
    font-family: var(--mono); font-size: 12px; color: var(--sky-mute);
  }
  .stats__metric { color: var(--cream); font-weight: 500; }
  .stats__metric strong { color: var(--sky); font-weight: 500; }
  .stats__refresh { background: none; border: 1px solid var(--sky-soft); color: var(--sky-mute); padding: 3px 8px; border-radius: 4px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; transition: border-color .2s; }
  .stats__refresh:hover { border-color: var(--sky); color: var(--cream); }
  .stats__empty { color: var(--sky-mute); font-style: italic; }
  .stats__time { font-size: 10px; color: var(--sky-mute); margin-left: auto; }

  /* ── Preview modal (IG mockup) ─── */
  .preview-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.88);
    display: none; align-items: flex-start; justify-content: center;
    z-index: 100; padding: 40px 16px; overflow-y: auto;
  }
  .preview-modal--open { display: flex; }
  .preview-close {
    position: fixed; top: 16px; right: 20px; background: transparent;
    border: 1px solid rgba(255,255,255,.3); color: white;
    width: 36px; height: 36px; border-radius: 50%; font-size: 18px;
    line-height: 1; cursor: pointer; transition: border-color .2s;
  }
  .preview-close:hover { border-color: white; }
  .preview-hint { color: rgba(255,255,255,.55); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 14px; }

  /* IG single post */
  .ig-post {
    background: white; color: #262626; width: 100%; max-width: 470px;
    border-radius: 8px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .ig-post__header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #efefef; }
  .ig-post__avatar {
    width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #f9ce34, #ee2a7b, #6228d7);
    padding: 2px;
  }
  .ig-post__avatar-inner {
    width: 100%; height: 100%; border-radius: 50%; background: white;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 700; color: #262626; font-size: 13px;
  }
  .ig-post__avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
  .ig-post__handle { font-weight: 600; font-size: 14px; }
  .ig-post__more { margin-left: auto; font-size: 18px; color: #262626; letter-spacing: 2px; }
  .ig-post__media { width: 100%; aspect-ratio: 1; background: #fafafa; }
  .ig-post__media img, .ig-post__media video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ig-post__actions { display: flex; gap: 14px; padding: 10px 14px; align-items: center; }
  .ig-post__actions svg { width: 24px; height: 24px; stroke: #262626; fill: none; stroke-width: 1.8; }
  .ig-post__actions svg:last-of-type { margin-left: auto; }
  .ig-post__caption { padding: 4px 14px 6px; font-size: 14px; line-height: 1.4; }
  .ig-post__caption .handle { font-weight: 600; margin-right: 6px; }
  .ig-post__time { padding: 0 14px 14px; font-size: 11px; color: #8e8e8e; text-transform: uppercase; letter-spacing: .04em; }
  .ig-post__badge {
    display: inline-block; margin-left: 8px; font-size: 9px; padding: 2px 6px;
    background: #efefef; color: #6c6c6c; border-radius: 3px; text-transform: uppercase; letter-spacing: .08em;
  }

  /* IG grid mockup */
  .ig-grid {
    width: 100%; max-width: 470px; background: white; border-radius: 8px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .ig-grid__header {
    display: flex; align-items: center; gap: 14px; padding: 20px 16px; border-bottom: 1px solid #efefef;
    color: #262626;
  }
  .ig-grid__avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #f9ce34, #ee2a7b, #6228d7); padding: 2px; }
  .ig-grid__avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: white; overflow: hidden; }
  .ig-grid__avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
  .ig-grid__handle { font-family: var(--display); font-size: 18px; color: #262626; }
  .ig-grid__meta { font-size: 12px; color: #8e8e8e; }
  .ig-grid__tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #efefef; }
  .ig-tile { aspect-ratio: 1; background: #fafafa; position: relative; overflow: hidden; cursor: pointer; }
  .ig-tile img, .ig-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ig-tile__empty { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 10px; color: #c7c7c7; letter-spacing: .14em; text-transform: uppercase; }
  .ig-tile__when { position: absolute; bottom: 4px; left: 6px; background: rgba(0,0,0,.55); color: white; font-size: 9px; padding: 2px 5px; border-radius: 2px; font-family: var(--mono); }
  .item__thumb { cursor: zoom-in; transition: opacity .15s; }
  .item__thumb:hover { opacity: .85; }

  /* IG Story preview (9:16 fullscreen) */
  .ig-story {
    position: relative; width: 100%; max-width: 320px; aspect-ratio: 9/16;
    background: #000; border-radius: 12px; overflow: hidden; color: white;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .ig-story__bg { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
  .ig-story__bg-img, .ig-story__bg-vid { position: absolute; inset: -10%; width: 120%; height: 120%; object-fit: cover; filter: blur(28px) saturate(1.3) brightness(.85); }
  .ig-story__progress { position: absolute; top: 8px; left: 8px; right: 8px; height: 2px; background: rgba(255,255,255,.3); border-radius: 1px; overflow: hidden; z-index: 3; }
  .ig-story__progress::after { content: ""; display: block; width: 35%; height: 100%; background: white; }
  .ig-story__header {
    position: absolute; top: 18px; left: 12px; right: 12px; z-index: 3;
    display: flex; align-items: center; gap: 10px;
  }
  .ig-story__avatar {
    width: 28px; height: 28px; border-radius: 50%; overflow: hidden;
    background: linear-gradient(135deg, #f9ce34, #ee2a7b, #6228d7); padding: 2px;
  }
  .ig-story__avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: white; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #262626; font-family: var(--display); font-weight: 700; font-size: 11px; }
  .ig-story__avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
  .ig-story__handle { font-size: 13px; font-weight: 600; }
  .ig-story__time { color: rgba(255,255,255,.7); font-size: 12px; }
  .ig-story__close { margin-left: auto; font-size: 16px; line-height: 1; }
  .ig-story__media {
    position: absolute; inset: 0; z-index: 1; display: flex;
    align-items: center; justify-content: center;
  }
  .ig-story__media img, .ig-story__media video { max-width: 100%; max-height: 100%; object-fit: contain; }
  .ig-story__footer {
    position: absolute; bottom: 14px; left: 12px; right: 12px; z-index: 3;
    display: flex; align-items: center; gap: 10px; font-size: 13px;
  }
  .ig-story__reply {
    flex: 1; border: 1px solid rgba(255,255,255,.5); border-radius: 999px;
    padding: 8px 14px; color: rgba(255,255,255,.7);
  }

  /* Warning de formato */
  .format-hint {
    margin-top: 8px; padding: 8px 12px; background: rgba(255,200,80,.12);
    border: 1px solid rgba(255,200,80,.4); border-radius: 6px; font-size: 12px;
    color: #ffd28a;
  }
  .format-hint--ok { background: rgba(141,226,143,.1); border-color: rgba(141,226,143,.35); color: var(--green); }

  .empty { padding: 32px; text-align: center; color: var(--sky-mute); border: 1px dashed var(--sky-soft); border-radius: 10px; font-style: italic; }

  /* ── Toast ────────────────────────────── */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--navy-2); border: 1px solid var(--sky); color: var(--cream); padding: 14px 18px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.4); max-width: 340px; transition: opacity .3s, transform .3s; }
  .toast--err { border-color: var(--red); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ===================== GATE ===================== -->
<div id="gate" class="gate">
  <div class="gate__brand">Publisher <em>· Daily Grind</em></div>
  <div class="gate__sub">Acceso restringido al equipo. Ingresa la clave compartida.</div>
  <form id="gate-form" class="gate__form" autocomplete="off">
    <input id="gate-pin" class="gate__input" type="password" placeholder="Clave" autocomplete="off" autofocus>
    <div id="gate-err" class="gate__err"></div>
    <button class="btn" type="submit">Entrar →</button>
  </form>
</div>

<!-- ===================== APP ====================== -->
<div id="app" class="shell hidden">

  <header class="head">
    <div>
      <div class="label label--muted">■ Daily Grind · Vol. 04</div>
      <h1 class="head__title" style="margin-top:6px">Publisher <em>· cola y agenda</em></h1>
      <div class="head__sub" id="whoami">Cargando cuenta…</div>
    </div>
    <button id="logout" class="head__logout">Salir</button>
  </header>

  <!-- ───── Nueva publicación ───── -->
  <section>
    <div class="section__head">
      <h2 class="section__title">Nueva publicación</h2>
      <span class="section__count mono" id="tz-note"></span>
    </div>
    <div class="composer">
      <div class="composer__kinds" role="tablist" id="kinds">
        <button class="kind-card" data-kind="ig-photo"    role="tab" aria-selected="true">
          <div class="kind-card__name">Foto feed</div>
          <div class="kind-card__hint">Instagram</div>
        </button>
        <button class="kind-card" data-kind="ig-reel"     role="tab" aria-selected="false">
          <div class="kind-card__name">Reel</div>
          <div class="kind-card__hint">Instagram</div>
        </button>
        <button class="kind-card" data-kind="ig-carousel" role="tab" aria-selected="false">
          <div class="kind-card__name">Carrusel</div>
          <div class="kind-card__hint">Instagram</div>
        </button>
        <button class="kind-card" data-kind="ig-story"    role="tab" aria-selected="false">
          <div class="kind-card__name">Story</div>
          <div class="kind-card__hint">Instagram</div>
        </button>
      </div>

      <!-- Campos dinámicos -->
      <div id="composer-fields"></div>

      <div class="when-row">
        <div class="form-row">
          <label class="form-label" for="when">Cuándo</label>
          <input id="when" class="form-input" type="datetime-local">
        </div>
        <div class="form-row">
          <label class="form-label" for="when-quick">Atajos</label>
          <select id="when-quick" class="form-input">
            <option value="">— elegir —</option>
            <option value="now">Ahora</option>
            <option value="+30m">En 30 min</option>
            <option value="+1h">En 1 hora</option>
            <option value="+3h">En 3 horas</option>
            <option value="today-12">Hoy 12:00</option>
            <option value="today-19">Hoy 19:00</option>
            <option value="tomorrow-9">Mañana 09:00</option>
            <option value="tomorrow-12">Mañana 12:00</option>
            <option value="tomorrow-19">Mañana 19:00</option>
          </select>
        </div>
      </div>

      <div class="composer__actions">
        <button id="btn-schedule" class="btn" type="button">Agendar →</button>
        <button id="btn-publish-now" class="btn btn--ghost" type="button">Publicar ahora ↗</button>
      </div>
      <div id="composer-status" class="composer__status"></div>
    </div>
  </section>

  <!-- ───── Cola ───── -->
  <section>
    <div class="section__head">
      <h2 class="section__title">Cola</h2>
      <div style="display:flex;gap:14px;align-items:center">
        <button id="btn-grid" class="head__logout" type="button">Vista grilla</button>
        <span class="section__count" id="queue-count">0 publicaciones agendadas</span>
      </div>
    </div>
    <div id="queue" class="item-list"></div>
  </section>

  <!-- ───── Historial ───── -->
  <section>
    <div class="section__head">
      <h2 class="section__title">Historial</h2>
      <span class="section__count" id="history-count">— recientes</span>
    </div>
    <div id="history" class="item-list"></div>
  </section>

</div>

<!-- ===================== PREVIEW MODAL ============ -->
<div id="preview-modal" class="preview-modal">
  <button id="preview-close" class="preview-close" type="button">✕</button>
  <div id="preview-content"></div>
</div>

<!-- ===================== TOAST ===================== -->
<div id="toast" class="toast hidden"></div>

<script>
// ============================================================================
// Estado + helpers
// ============================================================================
const TZ = "America/Santiago";
const API = "/publisher/api";
const dtfmt = new Intl.DateTimeFormat("es-CL", {
  timeZone: TZ, year: "numeric", month: "short", day: "2-digit",
  hour: "2-digit", minute: "2-digit", hour12: false,
});

document.getElementById("tz-note").textContent = "Hora · Santiago (CLT)";

async function api(path, opts = {}) {
  const resp = await fetch(API + path, {
    credentials: "include",
    headers: opts.body ? { "Content-Type": "application/json", ...(opts.headers || {}) } : (opts.headers || {}),
    method: opts.method || "GET",
    body: opts.body ? JSON.stringify(opts.body) : opts.raw || undefined,
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    const err = new Error(data.error || ("HTTP " + resp.status));
    err.data = data; err.status = resp.status;
    throw err;
  }
  return data;
}
async function apiUpload(file) {
  const fd = new FormData();
  fd.append("file", file);
  const resp = await fetch(API + "/upload", { method: "POST", credentials: "include", body: fd });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || "upload_failed");
  return data;
}
function toast(msg, kind) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast" + (kind === "err" ? " toast--err" : "");
  setTimeout(() => el.classList.add("hidden"), 4200);
}
function fmtWhen(iso) { try { return dtfmt.format(new Date(iso)); } catch { return iso; } }
function isoLocalToUtc(s) {
  if (!s) return null;
  // datetime-local viene sin zona → asumir local del usuario
  const d = new Date(s);
  return d.toISOString();
}
function nowPlus(minutes) {
  const d = new Date(Date.now() + minutes * 60_000);
  // Strip seconds for datetime-local
  d.setSeconds(0, 0);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60_000).toISOString().slice(0, 16);
}
function setAtHourToday(h, dayOffset = 0) {
  const d = new Date(); d.setDate(d.getDate() + dayOffset);
  d.setHours(h, 0, 0, 0);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60_000).toISOString().slice(0, 16);
}
function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// ============================================================================
// Gate
// ============================================================================
const gateForm = document.getElementById("gate-form");
const gateErr = document.getElementById("gate-err");
gateForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const pin = document.getElementById("gate-pin").value.trim();
  gateErr.textContent = "";
  try {
    await api("/auth", { method: "POST", body: { pin } });
    boot();
  } catch (err) {
    gateErr.textContent = err.status === 401 ? "Clave incorrecta." : "Error al entrar.";
  }
});

document.getElementById("logout").addEventListener("click", async () => {
  try { await api("/logout", { method: "POST" }); } catch {}
  location.reload();
});

// ============================================================================
// Compositor
// ============================================================================
const KIND_FIELDS = {
  "fb-text": [
    { type: "textarea", key: "message", label: "Mensaje", placeholder: "Texto del post." },
  ],
  "fb-link": [
    { type: "url",      key: "url",     label: "Link", placeholder: "https://dailygrind.cl/..." },
    { type: "textarea", key: "message", label: "Mensaje (opcional)", optional: true },
  ],
  "fb-photo": [
    { type: "file",     key: "image",   label: "Foto", accept: "image/*" },
    { type: "textarea", key: "caption", label: "Caption" },
  ],
  "ig-photo": [
    { type: "file",     key: "image",   label: "Foto", accept: "image/*" },
    { type: "textarea", key: "caption", label: "Caption" },
  ],
  "ig-reel": [
    { type: "file",     key: "video",   label: "Video (.mp4)", accept: "video/mp4" },
    { type: "textarea", key: "caption", label: "Caption" },
    { type: "checkbox", key: "share_to_feed", label: "Compartir al feed de IG" },
  ],
  "ig-carousel": [
    { type: "files",    key: "images",  label: "Fotos (2 a 10)", accept: "image/*" },
    { type: "textarea", key: "caption", label: "Caption" },
  ],
  "ig-story": [
    { type: "file",     key: "media",   label: "Foto o video (9:16)", accept: "image/*,video/mp4" },
  ],
};

const state = {
  kind: "ig-photo",
  uploads: {},    // key → { url, key, contentType }
  uploadsMulti: [], // for carousel
  ig: null,       // { username, profile_picture_url, followers_count, ... }
};

const fieldsRoot = document.getElementById("composer-fields");
function renderFields() {
  const fields = KIND_FIELDS[state.kind] || [];
  fieldsRoot.innerHTML = fields.map((f) => fieldHtml(f)).join("");
  fields.forEach((f) => {
    if (f.type === "file" || f.type === "files") wireDrop(f);
  });
}

function fieldHtml(f) {
  const id = "f-" + f.key;
  if (f.type === "textarea") {
    return `<div class="form-row"><label class="form-label" for="${id}">${f.label}</label>
      <textarea id="${id}" class="form-textarea" placeholder="${f.placeholder || ""}"></textarea></div>`;
  }
  if (f.type === "url") {
    return `<div class="form-row"><label class="form-label" for="${id}">${f.label}</label>
      <input id="${id}" class="form-input" type="url" placeholder="${f.placeholder || ""}"></div>`;
  }
  if (f.type === "checkbox") {
    return `<div class="form-row"><label style="display:flex;gap:10px;align-items:center;color:var(--cream);font-size:14px"><input id="${id}" type="checkbox" style="width:18px;height:18px;accent-color:var(--sky)"> ${f.label}</label></div>`;
  }
  if (f.type === "file" || f.type === "files") {
    const multi = f.type === "files" ? " multiple" : "";
    return `<div class="form-row"><label class="form-label">${f.label}</label>
      <label class="drop" id="drop-${f.key}" for="${id}">
        <div class="drop__title">Arrastra aquí o click para elegir</div>
        <div class="drop__hint" id="hint-${f.key}">${f.type === "files" ? "Entre 2 y 10 archivos" : "Un archivo"} · sube directo a R2</div>
        <div class="drop__preview" id="preview-${f.key}"></div>
        <input id="${id}" type="file" accept="${f.accept || "*"}"${multi}>
      </label></div>`;
  }
  return "";
}

function wireDrop(f) {
  const drop = document.getElementById("drop-" + f.key);
  const input = document.getElementById("f-" + f.key);
  const preview = document.getElementById("preview-" + f.key);
  const hint = document.getElementById("hint-" + f.key);
  if (!drop) return;

  ["dragenter","dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("drop--over"); }));
  ["dragleave","drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("drop--over"); }));
  drop.addEventListener("drop", (e) => { const files = Array.from(e.dataTransfer.files); handleFiles(f, files, preview, hint); });
  input.addEventListener("change", (e) => { const files = Array.from(e.target.files); handleFiles(f, files, preview, hint); });
}

async function handleFiles(f, files, preview, hint) {
  if (!files.length) return;
  if (f.type === "file") {
    hint.textContent = "Subiendo " + files[0].name + "…";
    try {
      const up = await apiUpload(files[0]);
      state.uploads[f.key] = up;
      preview.innerHTML = previewHtml(up, files[0]);
      hint.textContent = "Subido · " + up.url;
    } catch (e) { hint.textContent = "Error: " + e.message; }
  } else {
    hint.textContent = "Subiendo " + files.length + " archivos…";
    state.uploadsMulti = [];
    preview.innerHTML = "";
    for (const file of files) {
      try {
        const up = await apiUpload(file);
        state.uploadsMulti.push(up);
        preview.insertAdjacentHTML("beforeend", previewHtml(up, file));
      } catch (e) { hint.textContent = "Error: " + e.message; return; }
    }
    hint.textContent = state.uploadsMulti.length + " archivos listos";
  }
}

function previewHtml(up, file) {
  const ct = up.contentType || file.type || "";
  if (ct.startsWith("image/")) return `<img class="preview" src="${up.url}" alt="">`;
  if (ct.startsWith("video/")) return `<video class="preview" src="${up.url}" muted></video>`;
  return `<div class="preview" style="display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sky-mute)">${escapeHtml(file.name)}</div>`;
}

document.getElementById("kinds").addEventListener("click", (e) => {
  const card = e.target.closest(".kind-card"); if (!card) return;
  document.querySelectorAll(".kind-card").forEach((c) => c.setAttribute("aria-selected", "false"));
  card.setAttribute("aria-selected", "true");
  state.kind = card.dataset.kind;
  state.uploads = {}; state.uploadsMulti = [];
  renderFields();
});

document.getElementById("when-quick").addEventListener("change", (e) => {
  const v = e.target.value;
  const w = document.getElementById("when");
  if (v === "now") w.value = nowPlus(0);
  else if (v === "+30m") w.value = nowPlus(30);
  else if (v === "+1h") w.value = nowPlus(60);
  else if (v === "+3h") w.value = nowPlus(180);
  else if (v === "today-12") w.value = setAtHourToday(12);
  else if (v === "today-19") w.value = setAtHourToday(19);
  else if (v === "tomorrow-9") w.value = setAtHourToday(9, 1);
  else if (v === "tomorrow-12") w.value = setAtHourToday(12, 1);
  else if (v === "tomorrow-19") w.value = setAtHourToday(19, 1);
});

function buildPayloads(scheduledAtUtc) {
  const k = state.kind;
  const get = (key) => (document.getElementById("f-" + key) || {}).value || "";
  const checked = (key) => !!(document.getElementById("f-" + key) || {}).checked;
  const out = [];
  if (k === "fb-text") {
    out.push({ platform: "fb", kind: "text", params: { message: get("message") }, scheduled_at: scheduledAtUtc });
  } else if (k === "fb-link") {
    out.push({ platform: "fb", kind: "link", params: { url: get("url"), message: get("message") }, scheduled_at: scheduledAtUtc });
  } else if (k === "fb-photo") {
    const u = state.uploads.image; if (!u) throw new Error("Falta subir la foto");
    out.push({ platform: "fb", kind: "photo", params: { image_url: u.url, caption: get("caption") }, scheduled_at: scheduledAtUtc });
  } else if (k === "ig-photo") {
    const u = state.uploads.image; if (!u) throw new Error("Falta subir la foto");
    out.push({ platform: "ig", kind: "photo", params: { image_url: u.url, caption: get("caption") }, scheduled_at: scheduledAtUtc });
  } else if (k === "ig-reel") {
    const u = state.uploads.video; if (!u) throw new Error("Falta subir el video");
    out.push({ platform: "ig", kind: "reel", params: { video_url: u.url, caption: get("caption"), share_to_feed: checked("share_to_feed") }, scheduled_at: scheduledAtUtc });
  } else if (k === "ig-carousel") {
    const us = state.uploadsMulti; if (us.length < 2) throw new Error("Mínimo 2 fotos");
    out.push({ platform: "ig", kind: "carousel", params: { image_urls: us.map((u) => u.url), caption: get("caption") }, scheduled_at: scheduledAtUtc });
  } else if (k === "ig-story") {
    const u = state.uploads.media; if (!u) throw new Error("Falta subir foto o video");
    const isVideo = (u.contentType || "").startsWith("video/");
    const params = isVideo ? { video_url: u.url } : { image_url: u.url };
    out.push({ platform: "ig", kind: "story", params, scheduled_at: scheduledAtUtc });
  }
  return out;
}

async function submitSchedule(immediate) {
  const status = document.getElementById("composer-status");
  status.className = "composer__status";
  const w = document.getElementById("when").value;
  let whenIso;
  if (immediate) whenIso = new Date().toISOString();
  else if (!w) { status.textContent = "Elige fecha y hora"; status.classList.add("composer__status--err"); return; }
  else whenIso = isoLocalToUtc(w);
  try {
    const payloads = buildPayloads(whenIso);
    for (const p of payloads) await api("/queue", { method: "POST", body: p });
    status.textContent = immediate ? "Publicando…" : "Agendado · " + fmtWhen(whenIso);
    status.classList.add("composer__status--ok");
    toast("Encolado.");
    // limpiar uploads
    state.uploads = {}; state.uploadsMulti = [];
    renderFields();
    document.getElementById("when").value = "";
    await refreshQueue();
    await refreshHistory();
  } catch (e) {
    status.textContent = "Error: " + e.message;
    status.classList.add("composer__status--err");
  }
}

document.getElementById("btn-schedule").addEventListener("click", () => submitSchedule(false));
document.getElementById("btn-publish-now").addEventListener("click", () => submitSchedule(true));

// ============================================================================
// Cola + Historial
// ============================================================================
async function refreshQueue() {
  const { items } = await api("/queue");
  const el = document.getElementById("queue");
  document.getElementById("queue-count").textContent = items.length === 1 ? "1 publicación agendada" : items.length + " publicaciones agendadas";
  if (!items.length) { el.innerHTML = '<div class="empty">Cola vacía. Las publicaciones que agendes aparecen acá.</div>'; return; }
  el.innerHTML = items.map(itemHtml).join("");
  el.querySelectorAll("[data-action]").forEach((b) => b.addEventListener("click", onItemAction));
}
async function refreshHistory() {
  const { items } = await api("/history?limit=50");
  const el = document.getElementById("history");
  document.getElementById("history-count").textContent = items.length + " últimas";
  if (!items.length) { el.innerHTML = '<div class="empty">Aún no se ha publicado nada desde acá.</div>'; return; }
  el.innerHTML = items.map(historyHtml).join("");
  el.querySelectorAll("[data-stats-id]").forEach((b) => b.addEventListener("click", onStatsRefresh));
}

async function onStatsRefresh(e) {
  const btn = e.currentTarget;
  const id = btn.dataset.statsId;
  btn.disabled = true; btn.textContent = "…";
  try {
    const stats = await api(`/history/${id}/stats?refresh=true`);
    const card = document.querySelector(`[data-history-id="${id}"]`);
    if (!card) return;
    const newItem = { ...stats, id, stats_fetched_at: stats.fetched_at };
    // Re-render solo el bloque de stats; preservamos el resto del card buscando el .stats container
    const statsEl = card.querySelector(".stats");
    if (statsEl) {
      const wrap = document.createElement("div");
      wrap.innerHTML = statsHtml({ ...newItem, status: "published", platform: card.querySelector(".badge--fb,.badge--ig")?.textContent.split(" · ")[0].toLowerCase(), kind: card.querySelector(".badge")?.textContent.split(" · ")[1] || "" });
      statsEl.replaceWith(wrap.firstElementChild);
      // re-bind
      card.querySelectorAll("[data-stats-id]").forEach((b) => b.addEventListener("click", onStatsRefresh));
    }
    toast("Stats actualizadas.");
  } catch (err) {
    btn.disabled = false; btn.textContent = "Reintentar";
    toast("Error: " + err.message, "err");
  }
}

function thumbHtml(item) {
  const p = item.params || {};
  const u = p.image_url || (p.image_urls || [])[0] || p.video_url;
  if (u && (p.video_url === u)) return `<video src="${u}" muted></video>`;
  if (u) return `<img src="${u}" alt="">`;
  return `<div class="item__thumb-text">${(item.platform || "").toUpperCase()}<br>${(item.kind || "").toUpperCase()}</div>`;
}

function itemHtml(item) {
  const p = item.params || {};
  const cap = p.message || p.caption || p.url || "";
  const isProcessing = (item.last_error || "").startsWith("pending:");
  let statusBadge;
  if (item.status === "publishing" || isProcessing) {
    statusBadge = `<span class="badge badge--retrying">Procesando…</span>`;
  } else if (item.status === "retrying") {
    statusBadge = `<span class="badge badge--retrying">Reintentando ${item.attempts}/3</span>`;
  } else {
    statusBadge = `<span class="badge badge--pending">Pendiente</span>`;
  }
  const err = (item.last_error && !isProcessing) ? `<div class="item__err">${escapeHtml(item.last_error)}</div>` : "";
  return `<div class="item" data-id="${item.id}">
    <div class="item__thumb">${thumbHtml(item)}</div>
    <div class="item__body">
      <div class="item__meta">
        <span class="badge badge--${item.platform}">${item.platform.toUpperCase()} · ${item.kind}</span>
        ${statusBadge}
        <span class="item__when">${fmtWhen(item.scheduled_at)}</span>
      </div>
      <div class="item__caption ${cap ? '' : 'item__caption--muted'}">${cap ? escapeHtml(cap) : '(sin texto)'}</div>
      ${err}
    </div>
    <div class="item__actions">
      <button class="item__btn" data-action="publish-now" data-id="${item.id}">Publicar ya</button>
      <button class="item__btn item__btn--danger" data-action="cancel" data-id="${item.id}">Cancelar</button>
    </div>
  </div>`;
}

function historyHtml(item) {
  const p = item.params || {};
  const cap = p.message || p.caption || p.url || "";
  const badge = item.status === "published"
    ? `<span class="badge badge--published">Publicado</span>`
    : `<span class="badge badge--failed">Falló · ${item.attempts} intentos</span>`;
  const link = item.permalink ? `<a class="item__link" href="${item.permalink}" target="_blank" rel="noopener">Ver post ↗</a>` : "";
  const err = item.error ? `<div class="item__err">${escapeHtml(item.error)}</div>` : "";
  const stats = item.status === "published" ? statsHtml(item) : "";
  return `<div class="item" data-history-id="${item.id}">
    <div class="item__thumb">${thumbHtml(item)}</div>
    <div class="item__body">
      <div class="item__meta">
        <span class="badge badge--${item.platform}">${item.platform.toUpperCase()} · ${item.kind}</span>
        ${badge}
        <span class="item__when">${fmtWhen(item.finalized_at)}</span>
      </div>
      <div class="item__caption ${cap ? '' : 'item__caption--muted'}">${cap ? escapeHtml(cap) : '(sin texto)'}</div>
      ${err}
      ${link}
      ${stats}
    </div>
    <div></div>
  </div>`;
}

function statsHtml(item) {
  const hasStats = item.stats_fetched_at != null;
  if (!hasStats) {
    return `<div class="stats">
      <span class="stats__empty">Stats no cargadas todavía.</span>
      <button class="stats__refresh" data-stats-id="${item.id}">Cargar</button>
    </div>`;
  }
  const labels = {
    likes: item.platform === "ig" ? "me gusta" : "reacciones",
    comments: "comentarios",
    shares: "shares",
    saves: "guardados",
    reach: "alcance",
    views: item.kind === "reel" ? "plays" : (item.platform === "ig" ? "vistas" : "clicks"),
  };
  const parts = [];
  for (const k of ["likes", "comments", "shares", "saves", "reach", "views"]) {
    const v = item[k];
    if (typeof v === "number" && v > 0) {
      parts.push(`<span class="stats__metric"><strong>${v.toLocaleString("es-CL")}</strong> ${labels[k]}</span>`);
    }
  }
  if (!parts.length) parts.push(`<span class="stats__empty">Sin actividad aún.</span>`);
  return `<div class="stats">
    ${parts.join(" · ")}
    <span class="stats__time">${fmtWhen(item.stats_fetched_at)}</span>
    <button class="stats__refresh" data-stats-id="${item.id}">Actualizar</button>
  </div>`;
}

async function onItemAction(e) {
  const id = e.currentTarget.dataset.id;
  const action = e.currentTarget.dataset.action;
  if (action === "cancel") {
    if (!confirm("¿Cancelar esta publicación?")) return;
    await api("/queue/" + id, { method: "DELETE" });
    toast("Cancelada.");
    await refreshQueue();
  } else if (action === "publish-now") {
    await api("/queue/" + id + "/publish-now", { method: "POST" });
    toast("Marcado para publicar en el próximo tick (~1 min).");
    await refreshQueue();
  }
}

// ============================================================================
// Preview modal (IG mockup)
// ============================================================================
const SVG_HEART   = '<svg viewBox="0 0 24 24"><path d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 4.959-5.197 7.222-2.512 2.243-3.865 3.469-4.303 3.752-.477-.309-2.143-1.823-4.303-3.752C5.141 14.072 2.5 12.167 2.5 9.122a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.675 1.941c.84 1.175.98 1.763 1.117 1.763.136 0 .278-.588 1.117-1.762a4.21 4.21 0 0 1 3.675-1.942z"/></svg>';
const SVG_COMMENT = '<svg viewBox="0 0 24 24"><path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"/></svg>';
const SVG_SHARE   = '<svg viewBox="0 0 24 24"><line x1="22" y1="3" x2="9.218" y2="10.083"/><polygon points="11.698 20.334 22 3.001 2 3.001 9.218 10.084 11.698 20.334"/></svg>';
const SVG_SAVE    = '<svg viewBox="0 0 24 24"><polygon points="20 21 12 13.44 4 21 4 3 20 3 20 21"/></svg>';

const preview = {
  el: () => document.getElementById("preview-modal"),
  content: () => document.getElementById("preview-content"),
  open(html) { this.content().innerHTML = html; this.el().classList.add("preview-modal--open"); document.body.style.overflow = "hidden"; },
  close() { this.el().classList.remove("preview-modal--open"); document.body.style.overflow = ""; this.content().innerHTML = ""; },
};

function igHandle() { return state.ig?.username || "dailygrind.cl"; }
function igAvatarHtml() {
  if (state.ig?.profile_picture_url) {
    return `<div class="ig-post__avatar"><div class="ig-post__avatar-inner"><img src="${state.ig.profile_picture_url}" referrerpolicy="no-referrer"></div></div>`;
  }
  return `<div class="ig-post__avatar"><div class="ig-post__avatar-inner">${(igHandle()[0] || "d").toUpperCase()}</div></div>`;
}

function openPostPreview(item) {
  if (item.kind === "story") return openStoryPreview(item);
  const p = item.params || {};
  const url = p.image_url || (p.image_urls || [])[0] || p.video_url;
  const isVideo = !!p.video_url;
  const caption = p.caption || p.message || "";
  const when = item.finalized_at || item.scheduled_at;
  const kindBadge = item.kind === "reel" ? `<span class="ig-post__badge">Reel</span>` :
                    item.kind === "carousel" ? `<span class="ig-post__badge">Carrusel</span>` : "";
  const mediaHtml = isVideo
    ? `<video src="${url}" autoplay muted loop playsinline></video>`
    : url ? `<img src="${url}" alt="">` : `<div class="ig-tile__empty">Sin media</div>`;
  const status = item.status === "published" ? "Publicado" :
                 item.status === "failed" ? "Falló" : "Pendiente";
  const html = `
    <div>
      <div class="preview-hint">Cómo se verá en Instagram · ${status}</div>
      <div class="ig-post" onclick="event.stopPropagation()">
        <div class="ig-post__header">
          ${igAvatarHtml()}
          <div class="ig-post__handle">${igHandle()}${kindBadge}</div>
          <div class="ig-post__more">···</div>
        </div>
        <div class="ig-post__media">${mediaHtml}</div>
        <div class="ig-post__actions">${SVG_HEART}${SVG_COMMENT}${SVG_SHARE}${SVG_SAVE}</div>
        ${caption ? `<div class="ig-post__caption"><span class="handle">${igHandle()}</span>${escapeHtml(caption)}</div>` : ""}
        <div class="ig-post__time">${fmtWhen(when)}</div>
      </div>
    </div>`;
  preview.open(html);
}

function openStoryPreview(item) {
  const p = item.params || {};
  const url = p.image_url || p.video_url;
  const isVideo = !!p.video_url;
  const when = item.finalized_at || item.scheduled_at;
  const status = item.status === "published" ? "Publicado" :
                 item.status === "failed" ? "Falló" : "Pendiente";
  const avatarInner = state.ig?.profile_picture_url
    ? `<img src="${state.ig.profile_picture_url}" referrerpolicy="no-referrer">`
    : `${(igHandle()[0] || "d").toUpperCase()}`;
  const mediaEl = isVideo
    ? `<video src="${url}" autoplay muted loop playsinline></video>`
    : `<img src="${url}" alt="">`;
  const bgEl = isVideo
    ? `<video class="ig-story__bg-vid" src="${url}" autoplay muted loop playsinline></video>`
    : `<img class="ig-story__bg-img" src="${url}" referrerpolicy="no-referrer">`;
  const html = `
    <div>
      <div class="preview-hint">Cómo se verá la Story · ${status}</div>
      <div class="ig-story" onclick="event.stopPropagation()">
        <div class="ig-story__bg">${bgEl}</div>
        <div class="ig-story__progress"></div>
        <div class="ig-story__header">
          <div class="ig-story__avatar"><div class="ig-story__avatar-inner">${avatarInner}</div></div>
          <span class="ig-story__handle">${igHandle()}</span>
          <span class="ig-story__time">ahora</span>
          <span class="ig-story__close">✕</span>
        </div>
        <div class="ig-story__media">${mediaEl}</div>
        <div class="ig-story__footer">
          <div class="ig-story__reply">Enviar mensaje</div>
          ${SVG_HEART}${SVG_SHARE}
        </div>
      </div>
      <div id="story-format-hint" class="format-hint" style="max-width:320px;margin:14px auto 0;display:none"></div>
    </div>`;
  preview.open(html);
  // Chequear el aspect-ratio real
  checkAspect(url, isVideo, (info) => {
    const hint = document.getElementById("story-format-hint");
    if (!hint) return;
    if (!info) return;
    const target = 9 / 16;
    const ratio = info.w / info.h;
    const diff = Math.abs(ratio - target);
    if (diff < 0.02) {
      hint.className = "format-hint format-hint--ok";
      hint.style.display = "block";
      hint.textContent = `✓ Formato 9:16 correcto (${info.w}×${info.h}). La Story se ve a pantalla completa.`;
    } else {
      const aspectLabel = ratio > 1 ? "horizontal" : (Math.abs(ratio - 1) < 0.05 ? "1:1 cuadrada" : `${info.w}:${info.h}`);
      hint.style.display = "block";
      hint.textContent = `⚠ Imagen ${aspectLabel} (${info.w}×${info.h}). IG la mostrará centrada con fondo difuso. Para Story ideal usa 1080×1920 (9:16).`;
    }
  });
}

function checkAspect(url, isVideo, cb) {
  if (!url) return cb(null);
  if (isVideo) {
    const v = document.createElement("video");
    v.preload = "metadata"; v.muted = true;
    v.onloadedmetadata = () => cb({ w: v.videoWidth, h: v.videoHeight });
    v.onerror = () => cb(null);
    v.src = url;
  } else {
    const img = new Image();
    img.onload = () => cb({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => cb(null);
    img.src = url;
  }
}

async function openGridPreview() {
  const [q, h] = await Promise.all([api("/queue"), api("/history?limit=20")]);
  const merged = [
    ...q.items.map((i) => ({ ...i, _when: i.scheduled_at })),
    ...h.items.filter((i) => i.status === "published").map((i) => ({ ...i, _when: i.finalized_at })),
  ].sort((a, b) => (b._when || "").localeCompare(a._when || "")).slice(0, 9);
  const tiles = merged.map(tileHtml).join("");
  // relleno hasta 9
  const empties = Math.max(0, 9 - merged.length);
  const emptyTiles = Array(empties).fill('<div class="ig-tile"><div class="ig-tile__empty">— vacío —</div></div>').join("");
  const followers = typeof state.ig?.followers_count === "number" ? state.ig.followers_count.toLocaleString("es-CL") : "—";
  const handle = igHandle();
  const html = `
    <div>
      <div class="preview-hint">Vista grilla · cómo se leerá tu feed tras publicar lo agendado</div>
      <div class="ig-grid" onclick="event.stopPropagation()">
        <div class="ig-grid__header">
          <div class="ig-grid__avatar"><div class="ig-grid__avatar-inner">${state.ig?.profile_picture_url ? `<img src="${state.ig.profile_picture_url}" referrerpolicy="no-referrer">` : ""}</div></div>
          <div>
            <div class="ig-grid__handle">${handle}</div>
            <div class="ig-grid__meta">${followers} seguidores · ${merged.length} próximos posts</div>
          </div>
        </div>
        <div class="ig-grid__tiles">${tiles}${emptyTiles}</div>
      </div>
    </div>`;
  preview.open(html);
}

function tileHtml(item) {
  const p = item.params || {};
  const url = p.image_url || (p.image_urls || [])[0] || p.video_url;
  const isVideo = !!p.video_url;
  const whenLabel = new Intl.DateTimeFormat("es-CL", { timeZone: TZ, day: "2-digit", month: "short" }).format(new Date(item._when));
  const inner = url ? (isVideo ? `<video src="${url}" muted></video>` : `<img src="${url}" alt="">`) : `<div class="ig-tile__empty">${(item.kind || "").toUpperCase()}</div>`;
  return `<div class="ig-tile" data-tile-id="${item.id}" data-tile-source="${item.status === "published" ? "history" : "queue"}">${inner}<div class="ig-tile__when">${whenLabel}</div></div>`;
}

// Wire preview close + delegation
document.getElementById("preview-modal").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) preview.close();
});
document.getElementById("preview-close").addEventListener("click", () => preview.close());
document.addEventListener("keydown", (e) => { if (e.key === "Escape") preview.close(); });

// Click en thumbnails (queue + history) → preview de ese post
document.addEventListener("click", async (e) => {
  const thumb = e.target.closest(".item__thumb");
  if (!thumb) return;
  const card = thumb.closest(".item");
  if (!card) return;
  const id = card.dataset.id || card.dataset.historyId;
  if (!id) return;
  // intentar leer desde queue/history en memoria — más simple: refetch
  try {
    const [q, h] = await Promise.all([api("/queue"), api("/history?limit=200")]);
    const found = [...q.items, ...h.items].find((i) => i.id === id);
    if (found) openPostPreview(found);
  } catch (_) { /* ignorar */ }
});

// Click en tiles del grid → preview de ese post
document.addEventListener("click", async (e) => {
  const tile = e.target.closest(".ig-tile[data-tile-id]");
  if (!tile) return;
  e.stopPropagation();
  const id = tile.dataset.tileId;
  try {
    const [q, h] = await Promise.all([api("/queue"), api("/history?limit=200")]);
    const found = [...q.items, ...h.items].find((i) => i.id === id);
    if (found) openPostPreview(found);
  } catch (_) {}
});

// Botón "Vista grilla"
document.getElementById("btn-grid").addEventListener("click", openGridPreview);

// ============================================================================
// Boot
// ============================================================================
async function boot() {
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  renderFields();
  try {
    const w = await api("/whoami");
    state.ig = w.instagram_business_account || {};
    const fmt = (n) => (typeof n === "number" ? n.toLocaleString("es-CL") : "—");
    const fbFollowers = fmt(w.followers_count ?? w.fan_count);
    const igHandle = state.ig.username ? `@${state.ig.username}` : "(sin IG vinculado)";
    const igFollowers = fmt(state.ig.followers_count);
    const igMedia = typeof state.ig.media_count === "number" ? ` · ${fmt(state.ig.media_count)} posts` : "";
    document.getElementById("whoami").textContent = `${w.name} · ${fbFollowers} seguidores · IG ${igHandle} (${igFollowers}${igMedia})`;
  } catch (e) {
    document.getElementById("whoami").textContent = "Error consultando la cuenta.";
  }
  await refreshQueue();
  await refreshHistory();
  setInterval(refreshQueue, 30_000);
  setInterval(refreshHistory, 60_000);
}

// Auto-boot if session exists
(async () => {
  try { await api("/me"); boot(); } catch { /* show gate */ }
})();
</script>
