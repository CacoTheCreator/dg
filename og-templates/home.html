<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,500;1,300&family=Syne:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #0e1e56; color: #f9f3ec; font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }

  .canvas { position: relative; width: 1200px; height: 630px; padding: 56px 72px; display: flex; flex-direction: column; justify-content: space-between; }

  .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .label { font-family: "DM Sans"; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; font-size: 16px; color: #a6d9f8; }
  .ja { font-family: "DM Sans"; font-weight: 500; font-size: 18px; color: rgba(166, 217, 248, 0.65); letter-spacing: 0.05em; }

  .wordmark { font-family: "Syne", sans-serif; font-weight: 700; font-size: 72px; letter-spacing: -0.02em; line-height: 1; color: #f9f3ec; margin-top: 8px; }
  .wordmark .dot { color: #51b5f2; }

  .lockup { margin-top: 30px; }
  .lockup__h { font-family: "Syne", sans-serif; font-weight: 700; font-size: 124px; line-height: 0.96; letter-spacing: -0.03em; color: #f9f3ec; }
  .lockup__h em { font-family: "DM Sans", sans-serif; font-style: italic; font-weight: 300; color: #51b5f2; letter-spacing: -0.02em; }

  .bottom { display: flex; align-items: baseline; justify-content: space-between; }
  .vol { font-family: "DM Sans"; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; font-size: 16px; color: #a6d9f8; }
  .url { font-family: "DM Sans"; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; font-size: 16px; color: rgba(166, 217, 248, 0.6); }

  .rule { height: 1px; background: rgba(166, 217, 248, 0.25); margin: 14px 0 0; }
</style>
</head>
<body>
<div class="canvas">

  <div class="top">
    <div>
      <div class="label">Vol · 04 · Café</div>
      <div class="wordmark">THE DAILY <span class="dot">·</span> GRIND</div>
    </div>
    <div class="ja">ザ・デイリー</div>
  </div>

  <div class="lockup">
    <div class="lockup__h">Mismo ritual.</div>
    <div class="lockup__h"><em>Otro nivel.</em></div>
  </div>

  <div>
    <div class="rule"></div>
    <div class="bottom" style="margin-top: 18px;">
      <div class="vol">MMXXVI · La cafetería · La camisa</div>
      <div class="url">dailygrind.cl</div>
    </div>
  </div>

</div>
</body>
</html>
