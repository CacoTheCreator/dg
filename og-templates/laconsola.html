<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,500;1,300&family=Syne:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #f9f3ec; color: #0e1e56; font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }

  .canvas { position: relative; width: 1200px; height: 630px; padding: 56px 72px; display: flex; flex-direction: column; justify-content: space-between; }

  .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .top-left { display: flex; flex-direction: column; gap: 10px; }
  .label { font-family: "DM Sans"; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; font-size: 14px; color: #0e1e56; }
  .ja { font-family: "DM Sans"; font-weight: 500; font-size: 18px; color: rgba(14, 30, 86, 0.55); letter-spacing: 0.05em; }

  .lockup { margin-top: 4px; }
  .lockup__h { font-family: "Syne", sans-serif; font-weight: 700; font-size: 132px; line-height: 0.94; letter-spacing: -0.03em; color: #0e1e56; }
  .lockup__sub { font-family: "DM Sans", sans-serif; font-weight: 300; font-style: italic; font-size: 28px; line-height: 1.3; color: rgba(14, 30, 86, 0.7); margin-top: 14px; }

  .catalog { display: flex; gap: 36px; margin-top: 30px; }
  .item { display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; border: 1px solid rgba(14, 30, 86, 0.2); }
  .item__num { font-family: "DM Sans"; font-weight: 500; text-transform: uppercase; letter-spacing: 0.18em; font-size: 11px; color: rgba(14, 30, 86, 0.55); }
  .item__name { font-family: "Syne", sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.01em; color: #0e1e56; }
  .item__ja { font-family: "DM Sans"; font-weight: 500; font-size: 12px; color: #51b5f2; margin-top: 2px; }

  .rule { height: 1px; background: rgba(14, 30, 86, 0.18); }
  .bottom { display: flex; align-items: baseline; justify-content: space-between; padding-top: 16px; }
  .vol { font-family: "DM Sans"; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; font-size: 16px; color: #0e1e56; }
  .url { font-family: "DM Sans"; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; font-size: 16px; color: rgba(14, 30, 86, 0.6); }
</style>
</head>
<body>
<div class="canvas">

  <div class="top">
    <div class="top-left">
      <div class="label">Vol · 04 · Arcade</div>
    </div>
    <div class="ja">ラ・コンソラ</div>
  </div>

  <div class="lockup">
    <div class="lockup__h">La Consola.</div>
    <div class="lockup__sub">Juegos vibecodeados desde el lab.</div>

    <div class="catalog">
      <div class="item">
        <span class="item__num">K01</span>
        <span class="item__name">Snake</span>
        <span class="item__ja">ヘビ</span>
      </div>
      <div class="item">
        <span class="item__num">K02</span>
        <span class="item__name">Granos</span>
        <span class="item__ja">豆</span>
      </div>
      <div class="item">
        <span class="item__num">K03</span>
        <span class="item__name">Latte Art</span>
        <span class="item__ja">ラテアート</span>
      </div>
    </div>
  </div>

  <div>
    <div class="rule"></div>
    <div class="bottom">
      <div class="vol">The Daily Grind · Vol · 04 · MMXXVI</div>
      <div class="url">dailygrind.cl / laconsola</div>
    </div>
  </div>

</div>
</body>
</html>
