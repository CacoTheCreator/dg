<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,500;1,300&family=Syne:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #f9f3ec; color: #0e1e56; font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }

  .canvas { position: relative; width: 1200px; height: 630px; padding: 56px 72px; display: flex; flex-direction: column; justify-content: space-between; }

  .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .chip { font-family: "DM Sans"; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; font-size: 14px; color: #51b5f2; background: transparent; border: 1px solid #51b5f2; padding: 8px 14px; }
  .ja { font-family: "DM Sans"; font-weight: 500; font-size: 18px; color: rgba(14, 30, 86, 0.45); letter-spacing: 0.05em; }

  .lockup { margin-top: 12px; }
  .lockup__h { font-family: "Syne", sans-serif; font-weight: 700; font-size: 116px; line-height: 0.96; letter-spacing: -0.03em; color: #0e1e56; }
  .lockup__h em { font-family: "DM Sans", sans-serif; font-style: italic; font-weight: 300; color: #51b5f2; letter-spacing: -0.02em; }

  .stack { display: flex; align-items: baseline; gap: 18px; margin-top: 28px; }
  .stack__num { font-family: "Syne", sans-serif; font-weight: 700; font-size: 22px; color: rgba(14, 30, 86, 0.45); letter-spacing: 0; }
  .stack__name { font-family: "Syne", sans-serif; font-weight: 700; font-size: 22px; color: #0e1e56; letter-spacing: 0.01em; }
  .stack__sep { color: rgba(14, 30, 86, 0.4); font-size: 22px; }

  .rule { height: 1px; background: rgba(14, 30, 86, 0.18); }
  .bottom { display: flex; align-items: baseline; justify-content: space-between; padding-top: 16px; }
  .vol { font-family: "DM Sans"; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; font-size: 16px; color: #0e1e56; }
  .url { font-family: "DM Sans"; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; font-size: 16px; color: rgba(14, 30, 86, 0.6); }
</style>
</head>
<body>
<div class="canvas">

  <div class="top">
    <div class="chip">Previews · Para socios</div>
    <div class="ja">第四巻</div>
  </div>

  <div class="lockup">
    <div class="lockup__h">Lo que viene,</div>
    <div class="lockup__h"><em>en pantalla.</em></div>

    <div class="stack">
      <span class="stack__num">01</span><span class="stack__name">Hang tag</span>
      <span class="stack__sep">·</span>
      <span class="stack__num">02</span><span class="stack__name">Feed Vol. 4</span>
      <span class="stack__sep">·</span>
      <span class="stack__num">03</span><span class="stack__name">K03 Latte Art</span>
    </div>
  </div>

  <div>
    <div class="rule"></div>
    <div class="bottom">
      <div class="vol">The Daily Grind · Vol · 04 · MMXXVI</div>
      <div class="url">dailygrind.cl / previews</div>
    </div>
  </div>

</div>
</body>
</html>
