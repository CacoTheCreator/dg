<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,500;1,300&family=Syne:wght@400;700&family=Shippori+Mincho:wght@400;500&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  /* La feria se cita en su propia gráfica (Sora, lima, halftone) dentro de un
     marco TDG navy — misma regla que el as-marco de artstgo.html. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #0e1e56; color: #f9f3ec; font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }

  .canvas { position: relative; width: 1200px; height: 630px; padding: 52px 64px; display: flex; flex-direction: column; justify-content: space-between; }

  .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .label { font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; font-size: 15px; color: #a6d9f8; }
  .ja { font-family: "Shippori Mincho", serif; font-size: 19px; color: rgba(166, 217, 248, 0.65); }
  .wordmark { font-family: "Syne", sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.02em; line-height: 1; color: #f9f3ec; margin-top: 8px; }
  .wordmark .dot { color: #51b5f2; }

  .mid { display: flex; align-items: center; gap: 48px; }
  .voz { flex: 1 1 auto; }
  .voz h1 { font-family: "Syne", sans-serif; font-weight: 700; font-size: 74px; line-height: 1.0; letter-spacing: -0.02em; color: #f9f3ec; }
  .voz h1 em { font-family: "DM Sans", sans-serif; font-style: italic; font-weight: 300; color: #51b5f2; }
  .voz .bajada { margin-top: 20px; font-weight: 300; font-size: 22px; line-height: 1.45; color: rgba(249, 243, 236, 0.85); max-width: 480px; }

  .marco { position: relative; flex: 0 0 430px; height: 380px; background: #111111; border-radius: 10px; padding: 42px 38px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 22px 60px rgba(4, 9, 26, 0.55); }
  .marco::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(232, 255, 119, 0.14) 1.7px, transparent 1.7px); background-size: 15px 15px; }
  .marco .as-titulo { position: relative; font-family: "Sora", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 64px; line-height: 1.02; color: #E8FF77; }
  .marco .as-titulo span { color: #DE2990; }
  .marco .as-sub { position: relative; font-family: "Sora", sans-serif; font-weight: 400; font-size: 17px; color: #ffffff; margin-top: 16px; }
  .marco .fechas { position: relative; align-self: flex-start; margin-top: 22px; font-family: "Sora", sans-serif; font-weight: 700; font-size: 16px; text-transform: uppercase; background: #04798d; color: #ffffff; padding: 10px 18px; border-radius: 4px; }

  .sello { position: absolute; top: -22px; right: -22px; width: 108px; height: 108px; border-radius: 50%; background: #cf3f2f; color: #f9f3ec; display: flex; align-items: center; justify-content: center; font-family: "Shippori Mincho", serif; font-size: 44px; transform: rotate(-7deg); box-shadow: inset 0 0 0 5px #cf3f2f, inset 0 0 0 8px #f9f3ec; }

  .bottom { display: flex; align-items: baseline; justify-content: space-between; }
  .meta { font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; font-size: 15px; color: #a6d9f8; }
  .url { font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; font-size: 15px; color: rgba(166, 217, 248, 0.6); }
</style>
</head>
<body>
<div class="canvas">

  <div class="top">
    <div>
      <div class="label">Vol · 04 · Café</div>
      <div class="wordmark">THE DAILY <span class="dot">·</span> GRIND</div>
    </div>
    <div class="ja" lang="ja">芸術祭</div>
  </div>

  <div class="mid">
    <div class="voz">
      <h1>Nos vamos<br>a la <em>feria</em>.</h1>
      <p class="bajada">Helado y açaí en el pod de Plaza Central, con un sabor estrenado junto a un artista.</p>
    </div>
    <figure class="marco">
      <div class="as-titulo">ART<br><span>STGO</span></div>
      <div class="as-sub">El arte es lo que dejas salir</div>
      <div class="fechas">22 — 23 AGO · GAM</div>
      <div class="sello" lang="ja">初</div>
    </figure>
  </div>

  <div class="bottom">
    <div class="meta">Plaza Central · Pod</div>
    <div class="url">dailygrind.cl/artstgo</div>
  </div>

</div>
</body>
</html>
