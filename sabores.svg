<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!--
  Los sabores de la casa, dibujados con la misma mano que los monitos: línea
  sobre el cobalto, nunca relleno, y el color por `currentColor`.

  Cada uno dibuja la cosa y no una bolita con un color distinto: doce bolitas
  en línea serían doce círculos iguales y no se entendería ninguna.
-->
<defs>
  <style>
    .s-linea   { fill: none; stroke: currentColor; stroke-width: 5;
                 stroke-linecap: round; stroke-linejoin: round; }
    .s-detalle { fill: none; stroke: currentColor; stroke-width: 3.5;
                 stroke-linecap: round; stroke-linejoin: round; }
    .s-punto   { fill: currentColor; stroke: none; }
  </style>
</defs>

