<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!--
  Los monitos de la casa.

  Van dibujados en línea sobre el cobalto y nunca rellenos: el fondo se ve a
  través de ellos. Eso es lo que los separa de una calcomanía y lo que los deja
  en el mismo linaje de cianotipo que el resto de Estudio Azul. Nice To Meat
  resuelve su mascota al revés, con mancha negra cerrada sobre crema, así que
  las dos casas se acompañan sin parecerse.

  El color sale de `currentColor`: la misma figura es blanca sobre el cobalto y
  gris sobre el papel, sin tocar este archivo.

  Gramática común: trazo 5 en el cuerpo, 9 en brazos y piernas, 4 en la cara.
  Puntas y uniones redondas. Lo único relleno son los ojos.

  Cada uno tiene su propia postura a propósito, para que cuatro figuras no se
  lean como la misma plantilla cambiada de cuerpo: el barquillo camina y
  saluda, la bolita salta, la tarjeta se apunta a sí misma y el cartucho se
  apoya con las piernas cruzadas.
-->
<defs>
  <style>
    .m-cuerpo { fill: none; stroke: currentColor; stroke-width: 5;
                stroke-linecap: round; stroke-linejoin: round; }
    .m-miembro{ fill: none; stroke: currentColor; stroke-width: 9;
                stroke-linecap: round; stroke-linejoin: round; }
    .m-cara   { fill: none; stroke: currentColor; stroke-width: 4;
                stroke-linecap: round; stroke-linejoin: round; }
    .m-ojo    { fill: currentColor; stroke: none; }
    .m-guante { fill: none; stroke: currentColor; stroke-width: 5; }
  </style>
</defs>

<!-- EL BARQUILLO · camina y saluda. Acompaña la carta. -->
<symbol id="monito-barquillo" viewBox="0 0 200 260">
  <path class="m-cuerpo" d="M62 118 C56 90 72 66 90 72 C97 54 123 54 130 72
                            C150 70 156 96 138 118 Z"/>
  <path class="m-cuerpo" d="M66 118 L100 182 L134 118"/>
  <path class="m-cara" d="M78 118 L106 171 M90 118 L112 159 M102 118 L118 148
                          M114 118 L124 137 M122 118 L94 171 M110 118 L88 159
                          M98 118 L82 148 M86 118 L76 137"/>
  <circle class="m-ojo" cx="85" cy="92" r="6"/>
  <circle class="m-ojo" cx="115" cy="90" r="6"/>
  <path class="m-cara" d="M86 104 Q100 117 114 102"/>
  <path class="m-miembro" d="M68 126 C46 134 34 152 38 168"/>
  <circle class="m-guante" cx="37" cy="178" r="10"/>
  <path class="m-miembro" d="M132 124 C156 114 168 90 160 70"/>
  <circle class="m-guante" cx="158" cy="60" r="10"/>
  <path class="m-miembro" d="M96 177 C84 196 73 211 67 225"/>
  <path class="m-miembro" d="M104 177 C116 194 127 207 133 219"/>
  <rect class="m-cuerpo" x="46" y="218" width="34" height="17" rx="8.5"
        transform="rotate(-10 63 226)"/>
  <rect class="m-cuerpo" x="120" y="212" width="34" height="17" rx="8.5"
        transform="rotate(10 137 220)"/>
</symbol>

